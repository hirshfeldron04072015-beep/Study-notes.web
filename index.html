<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StudyNotes</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#111;
  --panel:#1a1a1a;
  --panel2:#202020;
  --line:#333;
  --text:#fff;
  --muted:#999;
  --hover:#292929;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:999;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  animation:introOut 1s ease 2.5s forwards;
}

.logo{
  width:120px;
  height:120px;
  position:relative;
}

.logo:before,
.logo:after{
  content:"";
  position:absolute;
  inset:15px;
  border:3px solid white;
  border-radius:50%;
  transform:rotate(45deg);
}

.logo:after{
  transform:rotate(-45deg);
}

.logoDot{
  position:absolute;
  width:28px;
  height:28px;
  border:3px solid white;
  border-radius:50%;
  left:46px;
  top:46px;
}

.introTitle{
  margin-top:25px;
  font-size:30px;
  font-weight:700;
}

@keyframes introOut{
  to{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
}

/* APP */

#app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

#sidebar{
  width:285px;
  min-width:285px;
  height:100%;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  transition:.25s ease;
  overflow:hidden;
}

#sidebar.closed{
  width:0;
  min-width:0;
}

.brand{
  padding:20px;
  font-size:21px;
  font-weight:700;
}

.search{
  margin:0 15px 10px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
  background:#111;
  color:white;
}

.newNote{
  margin:0 15px 15px;
  padding:11px;
  border:0;
  border-radius:9px;
  background:white;
  color:#111;
  font-weight:600;
}

.section{
  padding:10px 15px 5px;
  color:#777;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.folder{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 15px;
  margin:2px 8px;
  border-radius:8px;
}

.folder:hover{
  background:var(--hover);
}

.folderDelete{
  margin-left:auto;
  color:#777;
  opacity:0;
  border:0;
  background:none;
}

.folder:hover .folderDelete{
  opacity:1;
}

.addFolder{
  margin:3px 8px;
  padding:9px 15px;
  border:0;
  background:none;
  color:#aaa;
  text-align:left;
  border-radius:8px;
}

.addFolder:hover{
  background:var(--hover);
}

.notes{
  flex:1;
  overflow:auto;
}

.note{
  padding:10px 15px;
  margin:2px 8px;
  border-radius:8px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.note:hover{
  background:var(--hover);
}

.note.active{
  background:#333;
  font-weight:600;
}

.bottom{
  border-top:1px solid var(--line);
  padding:10px;
}

.bottom button{
  display:block;
  width:100%;
  border:0;
  background:none;
  color:white;
  text-align:left;
  padding:9px;
  border-radius:7px;
}

.bottom button:hover{
  background:var(--hover);
}

/* MAIN */

#main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:58px;
  min-height:58px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:3px;
  padding:0 12px;
}

.icon{
  width:38px;
  height:38px;
  border:0;
  background:none;
  color:white;
  border-radius:8px;
  font-size:19px;
}

.icon:hover{
  background:var(--hover);
}

.status{
  margin-left:auto;
  color:#777;
  font-size:12px;
}

/* EDITOR */

.title{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:38px;
  font-weight:700;
  padding:38px 8% 18px;
}

.title::placeholder{
  color:#666;
}

.toolbar{
  margin:0 8%;
  padding:7px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:3px;
  flex-wrap:wrap;
}

.tool{
  border:0;
  background:none;
  color:white;
  padding:7px 10px;
  border-radius:6px;
}

.tool:hover{
  background:var(--hover);
}

.colourButton{
  width:28px;
  height:28px;
  border-radius:50%;
  border:2px solid #555;
  padding:0;
}

.editorArea{
  flex:1;
  overflow:auto;
  padding:25px 8% 60px;
  position:relative;
}

#editor{
  min-height:500px;
  outline:0;
  color:white;
  font-size:17px;
  line-height:1.7;
}

#editor:empty:before{
  content:"Start writing here...";
  color:#555;
}

#editor span{
  color:inherit;
}

.stats{
  border-top:1px solid var(--line);
  padding:9px 8%;
  color:#777;
  font-size:12px;
}

/* HIGHLIGHT */

.highlight{
  background:#fff200;
  color:#111 !important;
  border-radius:2px;
  padding:0 2px;
}

/* DRAWING */

#drawingLayer{
  position:absolute;
  inset:0;
  display:none;
  pointer-events:none;
}

#drawingCanvas{
  width:100%;
  height:100%;
  touch-action:none;
  pointer-events:auto;
}

#drawingTools{
  position:sticky;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:max-content;
  max-width:95%;
  padding:8px;
  background:#222;
  border:1px solid #444;
  border-radius:12px;
  display:none;
  align-items:center;
  gap:5px;
  z-index:10;
}

.drawBtn{
  border:0;
  background:#333;
  color:white;
  padding:8px 10px;
  border-radius:7px;
}

.drawBtn:hover{
  background:#444;
}

.colour{
  width:25px;
  height:25px;
  border-radius:50%;
  border:2px solid #777;
  padding:0;
}

.black{background:#000}
.white{background:#fff}
.red{background:#ff3b30}
.blue{background:#0a84ff}
.green{background:#30d158}
.orange{background:#ff9f0a}
.purple{background:#bf5af2}
.pink{background:#ff375f}

/* PREVIEW */

#preview{
  display:none;
  font-size:17px;
  line-height:1.7;
}

#preview h1,
#preview h2,
#preview h3{
  color:white;
}

#preview pre{
  background:#000;
  border:1px solid #333;
  padding:15px;
  border-radius:8px;
  overflow:auto;
}

#preview blockquote{
  border-left:3px solid #777;
  padding-left:15px;
  color:#aaa;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:14px;
  padding:22px;
}

.modalBox h2{
  margin-top:0;
}

.modalBox button{
  padding:9px 12px;
  margin:4px;
  border:1px solid #555;
  background:#292929;
  color:white;
  border-radius:7px;
}

.modalInput{
  width:100%;
  padding:10px;
  background:#111;
  border:1px solid #444;
  color:white;
  border-radius:7px;
}

/* MOBILE */

@media(max-width:800px){

  #sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:100;
    box-shadow:5px 0 25px #000;
  }

  #sidebar.closed{
    transform:translateX(-100%);
    width:285px;
    min-width:285px;
  }

  .title{
    font-size:30px;
    padding-left:5%;
    padding-right:5%;
  }

  .toolbar{
    margin-left:5%;
    margin-right:5%;
  }

  .editorArea{
    padding-left:5%;
    padding-right:5%;
  }

  .stats{
    padding-left:5%;
    padding-right:5%;
  }

}
</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">
  <div class="logo">
    <div class="logoDot"></div>
  </div>
  <div class="introTitle">StudyNotes</div>
</div>

<!-- APP -->

<div id="app">

<aside id="sidebar">

  <div class="brand">◉ StudyNotes</div>

  <input
    id="search"
    class="search"
    placeholder="Search notes..."
  >

  <button class="newNote" onclick="newNote()">
    + New note
  </button>

  <div class="section">Folders</div>

  <div id="folders"></div>

  <button class="addFolder" onclick="addFolder()">
    + Add folder
  </button>

  <div class="section">Notes</div>

  <div id="notes" class="notes"></div>

  <div class="bottom">

    <button onclick="templates()">
      Templates
    </button>

    <button onclick="settings()">
      Settings
    </button>

    <button onclick="help()">
      ? Help
    </button>

  </div>

</aside>


<main id="main">

  <div class="topbar">

    <button class="icon" onclick="toggleSidebar()">
      ☰
    </button>

    <button class="icon" onclick="preview()">
      ◉
    </button>

    <button class="icon" onclick="pinNote()">
      ☆
    </button>

    <button class="icon" onclick="duplicateNote()">
      ⧉
    </button>

    <button class="icon" onclick="deleteNote()">
      ×
    </button>

    <div id="status" class="status">
      Saved
    </div>

  </div>


  <input
    id="title"
    class="title"
    placeholder="Note title"
  >


  <div class="toolbar">

    <button class="tool" onclick="formatText('bold')">
      <b>B</b>
    </button>

    <button class="tool" onclick="formatText('italic')">
      <i>I</i>
    </button>

    <button class="tool" onclick="formatText('underline')">
      <u>U</u>
    </button>

    <button class="tool" onclick="formatText('h2')">
      H2
    </button>

    <button class="tool" onclick="formatText('check')">
      ☑
    </button>

    <button class="tool" onclick="formatText('code')">
      &lt;/&gt;
    </button>

    <button class="tool" onclick="insertLink()">
      Link
    </button>

    <button
      class="tool"
      onclick="highlightSelection()"
      title="Highlight selected text"
    >
      🖍️
    </button>

    <button
      class="tool"
      onclick="openDrawing()"
      title="Drawing tools"
    >
      ✎
    </button>

  </div>


  <div class="editorArea">

    <div
      id="editor"
      contenteditable="true"
    ></div>

    <div id="preview"></div>

    <div id="drawingLayer">
      <canvas id="drawingCanvas"></canvas>
    </div>

  </div>


  <div id="drawingTools">

    <button class="drawBtn" onclick="setDrawTool('pen')">
      Pen
    </button>

    <button class="drawBtn" onclick="setDrawTool('pencil')">
      Pencil
    </button>

    <button class="drawBtn" onclick="setDrawTool('marker')">
      Highlighter
    </button>

    <button class="drawBtn" onclick="setDrawTool('eraser')">
      Eraser
    </button>

    <button class="colour black" onclick="setColour('#000')"></button>
    <button class="colour white" onclick="setColour('#fff')"></button>
    <button class="colour red" onclick="setColour('#ff3b30')"></button>
    <button class="colour blue" onclick="setColour('#0a84ff')"></button>
    <button class="colour green" onclick="setColour('#30d158')"></button>
    <button class="colour orange" onclick="setColour('#ff9f0a')"></button>
    <button class="colour purple" onclick="setColour('#bf5af2')"></button>
    <button class="colour pink" onclick="setColour('#ff375f')"></button>

    <button class="drawBtn" onclick="undoDraw()">↶</button>
    <button class="drawBtn" onclick="redoDraw()">↷</button>
    <button class="drawBtn" onclick="closeDrawing()">Done</button>

  </div>


  <div id="stats" class="stats">
    0 words · 0 characters · 0 min read
  </div>

</main>

</div>


<!-- MODAL -->

<div id="modal" class="modal">

  <div class="modalBox">

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

    <br>

    <button onclick="closeModal()">
      Close
    </button>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

const STORAGE="studynotes_final";

let data={
  notes:[],
  folders:[],
  current:null
};

let currentFolder=null;


/* =========================
   LOAD
========================= */

function load(){

  try{

    const saved=
      JSON.parse(localStorage.getItem(STORAGE));

    if(saved){
      data=saved;
    }

  }catch(e){}

  if(!Array.isArray(data.notes))
    data.notes=[];

  if(!Array.isArray(data.folders))
    data.folders=[];

  /*
    NO PREMADE FOLDERS.
    User creates them.
  */

  if(!data.notes.length){

    const note={
      id:Date.now(),
      title:"Welcome",
      content:"Welcome to StudyNotes.\n\nStart writing here...",
      folder:null,
      pin:false,
      drawing:null
    };

    data.notes.push(note);

  }

  if(!data.current)
    data.current=data.notes[0].id;

  currentFolder=null;

  save();

  render();

}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    STORAGE,
    JSON.stringify(data)
  );

}


/* =========================
   CURRENT
========================= */

function current(){

  return data.notes.find(
    n=>n.id===data.current
  );

}


/* =========================
   RENDER
========================= */

function render(){

  renderFolders();
  renderNotes();
  renderEditor();

}


/* =========================
   FOLDERS
========================= */

function renderFolders(){

  const box=
    document.getElementById("folders");

  box.innerHTML="";

  data.folders.forEach(folder=>{

    const row=
      document.createElement("div");

    row.className="folder";

    row.innerHTML=`
      <span>○ ${escapeHTML(folder)}</span>
      <button class="folderDelete"
        onclick="deleteFolder('${escapeAttr(folder)}')">
        ×
      </button>
    `;

    row.onclick=(e)=>{

      if(e.target.tagName==="BUTTON")return;

      currentFolder=folder;

      renderNotes();

    };

    box.appendChild(row);

  });

}


/* =========================
   ADD FOLDER
========================= */

function addFolder(){

  const name=
    prompt("Folder name:");

  if(!name)return;

  const clean=name.trim();

  if(!clean)return;

  if(data.folders.includes(clean)){

    alert("That folder already exists.");

    return;

  }

  data.folders.push(clean);

  currentFolder=clean;

  save();

  renderFolders();
  renderNotes();

}


/* =========================
   DELETE FOLDER
========================= */

function deleteFolder(name){

  name=
    name.replace(/&quot;/g,'"')
        .replace(/&#039;/g,"'");

  if(!confirm(
    `Delete folder "${name}"? Notes will not be deleted.`
  ))return;

  data.folders=
    data.folders.filter(f=>f!==name);

  data.notes.forEach(n=>{

    if(n.folder===name)
      n.folder=null;

  });

  if(currentFolder===name)
    currentFolder=null;

  save();

  render();

}


/* =========================
   NOTES
========================= */

function renderNotes(){

  const box=
    document.getElementById("notes");

  const search=
    document.getElementById("search")
      .value.toLowerCase();

  box.innerHTML="";

  data.notes
  .filter(n=>{

    if(currentFolder===null)
      return true;

    return n.folder===currentFolder;

  })
  .filter(n=>{

    if(!search)return true;

    return(
      n.title.toLowerCase().includes(search)||
      n.content.toLowerCase().includes(search)
    );

  })
  .sort((a,b)=>
    Number(b.pin)-Number(a.pin)
  )
  .forEach(n=>{

    const item=
      document.createElement("div");

    item.className=
      "note"+
      (n.id===data.current?" active":"");

    item.textContent=
      (n.pin?"★ ":"")+
      (n.title||"Untitled");

    item.onclick=()=>{

      data.current=n.id;

      save();

      renderEditor();
      renderNotes();

    };

    box.appendChild(item);

  });

}


/* =========================
   EDITOR
========================= */

function renderEditor(){

  const n=current();

  if(!n)return;

  document.getElementById("title").value=
    n.title||"";

  document.getElementById("editor").innerText=
    n.content||"";

  updateStats();

}


/* =========================
   UPDATE
========================= */

function update(){

  const n=current();

  if(!n)return;

  n.title=
    document.getElementById("title").value||
    "Untitled";

  n.content=
    document.getElementById("editor").innerText;

  save();

  document.getElementById("status")
    .textContent="Saved";

  updateStats();

  renderNotes();

}


/* =========================
   NEW NOTE
========================= */

function newNote(){

  const n={

    id:Date.now(),

    title:"Untitled note",

    content:"",

    folder:currentFolder,

    pin:false,

    drawing:null

  };

  data.notes.unshift(n);

  data.current=n.id;

  save();

  render();

  document.getElementById("title").focus();

}


/* =========================
   DELETE
========================= */

function deleteNote(){

  const n=current();

  if(!n)return;

  if(!confirm("Delete this note?"))
    return;

  data.notes=
    data.notes.filter(x=>x.id!==n.id);

  if(!data.notes.length){

    newNote();

    return;

  }

  data.current=data.notes[0].id;

  save();

  render();

}


/* =========================
   DUPLICATE
========================= */

function duplicateNote(){

  const n=current();

  if(!n)return;

  const copy={

    ...n,

    id:Date.now(),

    title:n.title+" copy",

    pin:false

  };

  data.notes.unshift(copy);

  data.current=copy.id;

  save();

  render();

}


/* =========================
   PIN
========================= */

function pinNote(){

  const n=current();

  if(!n)return;

  n.pin=!n.pin;

  save();

  renderNotes();

}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("closed");

}


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener(
  "input",
  renderNotes
);


/* =========================
   REAL TEXT FORMATTING
========================= */

function formatText(type){

  const editor=
    document.getElementById("editor");

  editor.focus();

  if(type==="bold")
    document.execCommand("bold");

  if(type==="italic")
    document.execCommand("italic");

  if(type==="underline")
    document.execCommand("underline");

  if(type==="h2")
    document.execCommand(
      "formatBlock",
      false,
      "h2"
    );

  if(type==="check"){

    document.execCommand(
      "insertText",
      false,
      "☐ "
    );

  }

  if(type==="code"){

    document.execCommand(
      "formatBlock",
      false,
      "pre"
    );

  }

  update();

}


/* =========================
   LINK
========================= */

function insertLink(){

  const url=
    prompt("Enter URL:");

  if(!url)return;

  document.execCommand(
    "createLink",
    false,
    url
  );

  update();

}


/* =========================
   YELLOW HIGHLIGHT
========================= */

function highlightSelection(){

  const editor=
    document.getElementById("editor");

  editor.focus();

  /*
    Bright yellow ONLY for highlighting.
  */

  document.execCommand(
    "hiliteColor",
    false,
    "#fff200"
  );

  update();

}


/* =========================
   DRAWING
========================= */

let canvas;
let ctx;
let drawing=false;
let drawColour="#fff";
let drawTool="pen";

let undoStack=[];
let redoStack=[];


function openDrawing(){

  canvas=
    document.getElementById("drawingCanvas");

  const layer=
    document.getElementById("drawingLayer");

  const tools=
    document.getElementById("drawingTools");

  const area=
    document.querySelector(".editorArea");

  layer.style.display="block";
  tools.style.display="flex";

  canvas.width=area.clientWidth;
  canvas.height=area.clientHeight;

  ctx=canvas.getContext("2d");

  ctx.lineCap="round";

  saveCanvasState();

  canvas.onpointerdown=startDraw;
  canvas.onpointermove=draw;
  canvas.onpointerup=endDraw;
  canvas.onpointerleave=endDraw;

}


function startDraw(e){

  drawing=true;

  const p=
    getPoint(e);

  ctx.beginPath();

  ctx.moveTo(p.x,p.y);

}


function draw(e){

  if(!drawing)return;

  const p=
    getPoint(e);

  if(drawTool==="eraser"){

    ctx.globalCompositeOperation=
      "destination-out";

    ctx.lineWidth=28;

  }else{

    ctx.globalCompositeOperation=
      "source-over";

    if(drawTool==="pen")
      ctx.lineWidth=3;

    if(drawTool==="pencil")
      ctx.lineWidth=2;

    if(drawTool==="marker")
      ctx.lineWidth=14;

    ctx.strokeStyle=drawColour;

    if(drawTool==="marker")
      ctx.globalAlpha=.45;
    else
      ctx.globalAlpha=1;

  }

  ctx.lineTo(p.x,p.y);

  ctx.stroke();

}


function endDraw(){

  if(!drawing)return;

  drawing=false;

  ctx.closePath();

  ctx.globalAlpha=1;

  saveCanvasState();

}


function getPoint(e){

  const r=
    canvas.getBoundingClientRect();

  return{

    x:e.clientX-r.left,

    y:e.clientY-r.top

  };

}


/* =========================
   DRAWING COLOUR PALETTE
========================= */

function setColour(colour){

  drawColour=colour;

  drawTool="pen";

}


/* =========================
   DRAWING TOOL
========================= */

function setDrawTool(tool){

  drawTool=tool;

}


/* =========================
   UNDO / REDO
========================= */

function saveCanvasState(){

  if(!canvas)return;

  undoStack.push(
    canvas.toDataURL()
  );

  if(undoStack.length>30)
    undoStack.shift();

  redoStack=[];

}


function undoDraw(){

  if(undoStack.length<2)return;

  const current=
    undoStack.pop();

  redoStack.push(current);

  restoreCanvas(
    undoStack[undoStack.length-1]
  );

}


function redoDraw(){

  if(!redoStack.length)return;

  const state=
    redoStack.pop();

  undoStack.push(state);

  restoreCanvas(state);

}


function restoreCanvas(src){

  const img=
    new Image();

  img.onload=()=>{

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.drawImage(img,0,0);

  };

  img.src=src;

}


/* =========================
   CLOSE DRAWING
========================= */

function closeDrawing(){

  document.getElementById(
    "drawingLayer"
  ).style.display="none";

  document.getElementById(
    "drawingTools"
  ).style.display="none";

}


/* =========================
   PREVIEW
========================= */

function preview(){

  const e=
    document.getElementById("editor");

  const p=
    document.getElementById("preview");

  if(p.style.display==="block"){

    p.style.display="none";
    e.style.display="block";

    return;

  }

  p.innerHTML=
    markdown(e.innerText);

  e.style.display="none";
  p.style.display="block";

}


/* =========================
   MARKDOWN
========================= */

function markdown(t){

  let h=escape(t);

  h=h.replace(
    /^### (.*)$/gm,
    "<h3>$1</h3>"
  );

  h=h.replace(
    /^## (.*)$/gm,
    "<h2>$1</h2>"
  );

  h=h.replace(
    /^# (.*)$/gm,
    "<h1>$1</h1>"
  );

  h=h.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  h=h.replace(
    /\*(.*?)\*/g,
    "<em>$1</em>"
  );

  h=h.replace(
    /\n/g,
    "<br>"
  );

  return h;

}


/* =========================
   STATS
========================= */

function updateStats(){

  const text=
    document.getElementById("editor")
      .innerText.trim();

  const words=
    text ? text.split(/\s+/).length : 0;

  const chars=text.length;

  const minutes=
    Math.max(
      0,
      Math.ceil(words/200)
    );

  document.getElementById("stats")
    .textContent=
    words+
    " words · "+
    chars+
    " characters · "+
    minutes+
    " min read";

}

========================= */

  ).textContent=title;

  ).innerHTML=body;

  document.getElementById(
    "modal"
  ).classList.add("show");

}


function closeModal(){

  document.getElementById(
    "modal"
  ).classList.remove("show");

}


/* =========================
   RESET
========================= */

function resetNotes(){

  if(!confirm(
    "Delete all StudyNotes data?"
  ))return;

  localStorage.removeItem(STORAGE);

  location.reload();

}


/* =========================
   ESCAPE
========================= */

function escape(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(text){

  return escape(text);

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(e){

  const mod=
    e.ctrlKey||e.metaKey;

  if(mod&&e.key.toLowerCase()==="n"){

    e.preventDefault();
    newNote();

  }

  if(mod&&e.key.toLowerCase()==="s"){

    e.preventDefault();
    update();

  }

  if(mod&&e.key.toLowerCase()==="f"){

    e.preventDefault();

    document
      .getElementById("search")
      .focus();

  }

  if(mod&&e.key.toLowerCase()==="b"){

    e.preventDefault();

    formatText("bold");

  }

  if(mod&&e.key.toLowerCase()==="i"){

    e.preventDefault();

    formatText("italic");

  }

  if(e.key==="Escape")
    closeModal();

});


/* =========================
   START
========================= */

document
.getElementById("title")
.addEventListener(
  "input",
  update
);

document
.getElementById("editor")
.addEventListener(
  "input",
  update
);

load();
