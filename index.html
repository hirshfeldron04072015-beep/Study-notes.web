<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>StudyNotes</title>

<style>
:root{
--bg:#070707;
--surface:#0d0d0d;
--surface2:#141414;
--surface3:#1b1b1b;
--line:#262626;
--text:#f3f3f3;
--muted:#737373;
--soft:#aaa;
--highlight:#c9c35b;
--shadow:rgba(0,0,0,.45);
--ease:cubic-bezier(.2,.8,.2,1)
}

html[data-theme="light"]{
--bg:#f5f5f7;
--surface:#ffffff;
--surface2:#eeeeF1;
--surface3:#e5e5e9;
--line:#d9d9de;
--text:#171717;
--muted:#77777d;
--soft:#5e5e64;
--highlight:#d8d06a;
--shadow:rgba(0,0,0,.12)
}

@media(prefers-color-scheme:light){
html[data-theme="system"]{
--bg:#f5f5f7;
--surface:#ffffff;
--surface2:#eeeeF1;
--surface3:#e5e5e9;
--line:#d9d9de;
--text:#171717;
--muted:#77777d;
--soft:#5e5e64;
--highlight:#d8d06a;
--shadow:rgba(0,0,0,.12)
}
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
overflow:hidden;
-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility;
transition:
background-color .35s var(--ease),
color .35s var(--ease)
}

button,input,select{
font:inherit
}

button{
border:0;
cursor:pointer;
color:inherit
}

button:focus-visible,
input:focus-visible,
[contenteditable]:focus-visible{
outline:2px solid #777;
outline-offset:3px
}

*{
scrollbar-width:thin;
scrollbar-color:#444 transparent
}

html[data-theme="light"] *{
scrollbar-color:#bcbcc2 transparent
}

::-webkit-scrollbar{
width:7px;
height:7px
}

::-webkit-scrollbar-track{
background:transparent
}

::-webkit-scrollbar-thumb{
background:#444;
border-radius:99px
}

html[data-theme="light"] ::-webkit-scrollbar-thumb{
background:#bcbcc2
}

/* INTRO */

#intro{
position:fixed;
inset:0;
z-index:9999;
display:grid;
place-items:center;
background:#070707;
overflow:hidden;
animation:introAutoExit 1.15s var(--ease) 3.1s forwards
}

#intro:before,
#intro:after{
content:"";
position:absolute;
border:1px solid #252525;
border-radius:50%;
width:240px;
height:240px;
opacity:0;
animation:orbitGlow 2.4s var(--ease) .1s forwards
}

#intro:after{
width:420px;
height:420px;
animation-delay:.25s
}

.introCore{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
animation:introCore 1.25s var(--ease) forwards
}

.introLogo{
width:132px;
height:132px;
filter:drop-shadow(0 0 28px #fff1)
}

.introName{
font-size:29px;
font-weight:650;
letter-spacing:-.8px
}

.introRule{
width:0;
height:1px;
background:#666;
animation:introRule 1s ease .55s forwards
}

@keyframes introCore{
from{
opacity:0;
transform:scale(.72) translateY(18px);
filter:blur(9px)
}
to{
opacity:1;
transform:none;
filter:none
}
}

@keyframes introRule{
to{
width:115px
}
}

@keyframes orbitGlow{
from{
opacity:0;
transform:scale(.55)
}
60%{
opacity:.7
}
to{
opacity:0;
transform:scale(1.35)
}
}

@keyframes introAutoExit{
0%{
opacity:1;
transform:scale(1);
visibility:visible
}
100%{
opacity:0;
transform:scale(1.13);
visibility:hidden;
pointer-events:none
}
}

@keyframes introExit{
0%{
opacity:1;
transform:scale(1)
}
35%{
opacity:1;
transform:scale(1.035)
}
100%{
opacity:0;
transform:scale(1.13);
visibility:hidden;
pointer-events:none
}
}

/* APP */

#app{
height:100%;
display:flex;
background:var(--bg)
}

/* SIDEBAR */

#sidebar{
width:300px;
min-width:300px;
background:linear-gradient(180deg,var(--surface),var(--bg));
border-right:1px solid var(--line);
display:flex;
flex-direction:column;
overflow:hidden;
box-shadow:8px 0 35px rgba(0,0,0,.08);
transition:
width .38s var(--ease),
min-width .38s var(--ease),
transform .38s var(--ease),
opacity .25s,
background .35s,
border-color .35s
}

#sidebar.closed{
width:0;
min-width:0;
border-right:0;
opacity:0
}

.sideTop{
padding:20px 17px 12px
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-size:19px;
font-weight:650;
margin-bottom:19px
}

.brand svg{
width:27px;
height:27px;
flex:none
}

.searchWrap{
position:relative
}

.searchIcon{
position:absolute;
left:13px;
top:10px;
color:var(--muted);
pointer-events:none
}

.search{
width:100%;
height:42px;
border:1px solid var(--line);
background:var(--surface2);
color:var(--text);
border-radius:12px;
padding:0 12px 0 36px;
outline:0;
box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
transition:
border-color .25s,
box-shadow .25s,
background .35s,
color .35s
}

.search:focus{
border-color:#666;
box-shadow:0 0 0 4px rgba(120,120,120,.1)
}

.search::placeholder{
color:var(--muted)
}

.sideTitle{
padding:15px 17px 7px;
color:var(--muted);
font-size:10px;
font-weight:700;
letter-spacing:1.2px;
text-transform:uppercase
}

.folders{
max-height:230px;
overflow:auto;
padding:0 8px
}

.notes{
flex:1;
overflow:auto;
padding:0 8px 10px
}

.folder,
.note{
display:flex;
align-items:center;
min-height:40px;
padding:0 10px;
border-radius:10px;
margin:2px 0;
color:var(--soft);
font-size:14px;
transition:
background .18s,
color .18s,
transform .18s,
box-shadow .25s
}

.folder:hover,
.note:hover{
background:var(--surface2);
color:var(--text);
transform:translateX(2px)
}

.folder.active,
.note.active{
background:var(--surface3);
color:var(--text);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)
}

html[data-theme="light"] .folder.active,
html[data-theme="light"] .note.active{
box-shadow:inset 0 0 0 1px rgba(0,0,0,.035)
}

.dot{
width:7px;
height:7px;
border:1px solid #888;
border-radius:50%;
margin-right:9px;
flex:none
}

.folderName,
.noteName{
flex:1;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.folderDel{
opacity:0;
background:none;
color:var(--muted);
padding:4px 5px
}

.folder:hover .folderDel{
opacity:1
}

.addFolder,
.sideButton{
width:100%;
background:none;
color:var(--muted);
text-align:left;
padding:9px 10px;
border-radius:9px;
transition:
background .18s,
color .18s,
transform .18s
}

.addFolder:hover,
.sideButton:hover{
background:var(--surface2);
color:var(--text)
}

.addFolder:active,
.sideButton:active{
transform:scale(.98)
}

.sideBottom{
border-top:1px solid var(--line);
padding:8px
}

/* MAIN */

#main{
min-width:0;
flex:1;
height:100%;
display:flex;
flex-direction:column
}

.topbar{
height:58px;
min-height:58px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
gap:3px;
padding:0 12px
}

.icon{
width:37px;
height:37px;
background:none;
border-radius:10px;
color:var(--muted);
display:grid;
place-items:center;
transition:
background .18s,
color .18s,
transform .18s,
box-shadow .18s
}

.icon:hover{
background:var(--surface2);
color:var(--text);
transform:translateY(-1px)
}

.icon:active{
transform:scale(.93)
}

.icon.active{
background:var(--surface3);
color:var(--text)
}

.status{
margin-left:auto;
color:var(--muted);
font-size:11px;
padding-right:5px
}

/* TITLE */

.noteHeader{
display:flex;
align-items:center;
padding:34px 8% 15px
}

.title{
flex:1;
min-width:0;
border:0;
outline:0;
background:transparent;
color:var(--text);
font-size:40px;
font-weight:680;
letter-spacing:-1.5px
}

.title::placeholder{
color:var(--muted)
}

.pin{
color:var(--muted);
margin-left:10px
}

/* TOOLBAR */

.toolbar{
margin:0 8%;
height:49px;
border-top:1px solid var(--line);
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
gap:2px;
overflow-x:auto;
background:linear-gradient(to bottom,transparent,rgba(255,255,255,.012))
}

html[data-theme="light"] .toolbar{
background:linear-gradient(to bottom,transparent,rgba(0,0,0,.018))
}

.tool{
height:34px;
min-width:34px;
padding:0 9px;
background:none;
border-radius:8px;
color:var(--muted);
display:grid;
place-items:center;
transition:
background .18s,
color .18s,
transform .18s
}

.tool:hover{
background:var(--surface2);
color:var(--text);
transform:translateY(-1px)
}

.tool:active{
transform:scale(.93)
}

.tool.active{
background:var(--text);
color:var(--bg)
}

.sep{
width:1px;
height:22px;
background:var(--line);
margin:0 5px;
flex:none
}

/* EDITOR */

.editorWrap{
position:relative;
flex:1;
min-height:0;
overflow:auto;
padding:28px 8% 75px;
transition:padding .3s var(--ease)
}

.editorWrap.drawingToolsOpen{
padding-top:96px
}

.editorWrap.drawingHighlighterOpen{
padding-top:96px
}

.editor{
min-height:520px;
outline:0;
color:var(--text);
font-size:17px;
line-height:1.76;
caret-color:var(--text);
transition:
color .35s var(--ease),
opacity .2s
}

.editor:empty:before{
content:"";
color:var(--muted)
}

.editor h1{
font-size:33px;
line-height:1.18
}

.editor h2{
font-size:25px;
line-height:1.25
}

.editor h3{
font-size:20px
}

.editor pre{
background:var(--surface2);
border:1px solid var(--line);
border-radius:11px;
padding:15px;
white-space:pre-wrap
}

.editor blockquote{
border-left:3px solid #777;
padding-left:15px;
color:var(--soft)
}

.editor a{
color:var(--text)
}

.editor mark{
background:var(--highlight);
color:#111;
padding:0 2px;
border-radius:3px
}

.editor table{
border-collapse:collapse;
width:100%
}

.editor td{
border:1px solid var(--line);
padding:12px;
vertical-align:top
}

.stats{
height:34px;
min-height:34px;
border-top:1px solid var(--line);
display:flex;
align-items:center;
padding:0 8%;
font-size:11px;
color:var(--muted)
}

/* TEXT COLOUR */

.pop{
position:fixed;
z-index:500;
display:none;
background:var(--surface3);
border:1px solid var(--line);
border-radius:14px;
padding:9px;
box-shadow:0 20px 60px var(--shadow);
backdrop-filter:blur(20px);
gap:7px;
flex-wrap:wrap;
animation:popIn .18s var(--ease)
}

.pop.show{
display:flex
}

@keyframes popIn{
from{
opacity:0;
transform:translateY(-5px) scale(.96)
}
to{
opacity:1;
transform:none
}
}

.swatch{
width:28px;
height:28px;
border-radius:50%;
border:2px solid #555
}

.sblack{background:#050505}
.swhite{background:#fff}
.sred{background:#ff453a}
.sorange{background:#ff9f0a}
.syellow{background:#ffd60a}
.sgreen{background:#30d158}
.sblue{background:#0a84ff}
.spurple{background:#bf5af2}
.spink{background:#ff375f}

/* DRAWING */

#drawOverlay{
position:absolute;
inset:0;
z-index:200;
display:none;
background:rgba(7,7,7,.08);
backdrop-filter:blur(1px)
}

#drawOverlay.highlighterMode{
pointer-events:none;
background:transparent!important;
backdrop-filter:none!important;
-webkit-backdrop-filter:none!important
}

#drawOverlay.highlighterMode .drawTop,
#drawOverlay.highlighterMode #ruler{
pointer-events:auto
}

#drawOverlay.highlighterMode .drawBottom{
display:none
}

.drawCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
touch-action:none
}

.drawTop{
position:absolute;
top:10px;
right:16px;
left:auto;
transform:none;
display:flex;
align-items:center;
gap:5px;
padding:7px;
background:rgba(26,26,26,.92);
border:1px solid #393939;
border-radius:14px;
box-shadow:0 15px 45px #0009;
backdrop-filter:blur(22px);
max-width:94%;
overflow:auto
}

.drawBottom{
position:absolute;
bottom:17px;
left:50%;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:5px;
padding:7px;
background:rgba(26,26,26,.92);
border:1px solid #393939;
border-radius:15px;
box-shadow:0 18px 55px #0009;
backdrop-filter:blur(22px);
max-width:96%;
overflow:auto
}

.drawTool{
height:36px;
padding:0 11px;
border-radius:9px;
background:#232323;
color:#aaa;
font-size:12px;
white-space:nowrap;
transition:.18s
}

.drawTool:hover{
background:#333;
color:#fff
}

.drawTool.active{
background:#f0f0f0;
color:#111
}

.drawColor{
width:25px;
height:25px;
border-radius:50%;
border:2px solid #555;
flex:none
}

.drawColor.selected{
border-color:#fff;
box-shadow:0 0 0 2px #111 inset
}

.cBlack{background:#050505}
.cWhite{background:#fff}
.cRed{background:#ff453a}
.cOrange{background:#ff9f0a}
.cYellow{background:#ffd60a}
.cGreen{background:#30d158}
.cBlue{background:#0a84ff}
.cPurple{background:#bf5af2}
.cPink{background:#ff375f}

.size{
height:36px;
background:#232323;
border:0;
color:#aaa;
border-radius:9px;
padding:0 7px
}

.ruler{
position:absolute;
z-index:3;
left:20%;
top:30%;
width:360px;
height:48px;
border-radius:9px;
background:linear-gradient(#4b4b4b,#292929);
border:1px solid #777;
box-shadow:0 12px 35px #000b;
display:none;
align-items:flex-end;
justify-content:space-around;
padding:0 10px 7px;
color:#bbb;
font-size:9px;
cursor:grab;
touch-action:none
}

.ruler.show{
display:flex
}

.ruler:before{
content:"";
position:absolute;
left:10px;
right:10px;
top:9px;
height:1px;
background:#777;
box-shadow:
0 8px #666,
0 16px #666,
0 24px #666
}

.ruler:active{
cursor:grabbing
}

/* TEMPLATES */

.templateGrid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}

.templateCard{
background:var(--surface2);
border:1px solid var(--line);
border-radius:14px;
padding:12px;
text-align:left;
transition:.2s;
box-shadow:0 4px 18px var(--shadow)
}

.templateCard:hover{
background:var(--surface3);
border-color:#555;
transform:translateY(-2px);
box-shadow:0 10px 30px var(--shadow)
}

.templatePreview{
height:100px;
border-radius:9px;
background:var(--bg);
border:1px solid var(--line);
padding:10px;
display:grid;
gap:7px;
margin-bottom:10px
}

.templatePreview span{
display:block;
height:7px;
background:#444;
border-radius:4px
}

.shapeDaily{
grid-template-columns:1fr
}

.shapeDaily span:nth-child(1){
width:55%;
height:12px
}

.shapeDaily span:nth-child(2){
width:85%
}

.shapeDaily span:nth-child(3){
width:72%
}

.shapeDaily span:nth-child(4){
width:90%
}

.shapeCornell{
grid-template-columns:35% 65%;
grid-template-rows:1fr 20px
}

.shapeCornell span:nth-child(3){
grid-column:1/3
}

.shapeExam{
grid-template-columns:1fr 1fr
}

.shapeExam span:nth-child(1),
.shapeExam span:nth-child(4){
height:13px
}

.shapeEssay{
grid-template-columns:1fr
}

.shapeEssay span:nth-child(2){
width:75%
}

.shapeEssay span:nth-child(3){
width:90%
}

.shapeProject{
grid-template-columns:1fr 1fr
}

.shapeFlash{
grid-template-columns:1fr 1fr 1fr
}

.templateName{
font-size:14px;
font-weight:650;
margin-bottom:4px
}

.templateDesc{
font-size:11px;
line-height:1.45;
color:var(--muted)
}

/* MODAL */

#modal{
position:fixed;
inset:0;
z-index:1000;
display:none;
place-items:center;
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px)
}

#modal.show{
display:grid;
animation:modalIn .2s ease
}

.modalBox{
width:min(620px,92vw);
max-height:82vh;
overflow:auto;
background:var(--surface);
border:1px solid var(--line);
border-radius:18px;
box-shadow:0 30px 100px #000c;
padding:20px
}

.modalHeader{
display:flex;
align-items:center;
margin-bottom:18px
}

.modalTitle{
font-size:22px;
font-weight:650;
flex:1
}

.modalClose{
width:34px;
height:34px;
border-radius:9px;
background:var(--surface2);
color:var(--muted)
}

.modalClose:hover{
background:var(--surface3);
color:var(--text)
}

.settingRow{
display:flex;
align-items:center;
gap:12px;
padding:15px 0;
border-bottom:1px solid var(--line);
color:var(--soft);
font-size:13px
}

.settingRow>button{
margin-left:auto;
background:var(--surface3);
padding:8px 11px;
border-radius:8px;
color:var(--text)
}

.settingRow>button:hover{
background:var(--surface2)
}

.themeChoices{
margin-left:auto;
display:flex;
gap:5px
}

.themeChoice{
background:var(--surface3);
padding:8px 10px;
border-radius:8px;
color:var(--muted);
transition:.2s
}

.themeChoice:hover{
color:var(--text)
}

.themeChoice.active{
background:var(--text);
color:var(--bg)
}

.helpText{
font-size:14px;
line-height:1.7;
color:var(--soft)
}

@keyframes modalIn{
from{
opacity:0;
transform:scale(.96) translateY(8px)
}
to{
opacity:1;
transform:none
}
}

/* MOBILE */

@media(max-width:700px){

#sidebar{
width:260px;
min-width:260px
}

.noteHeader{
padding-left:5%;
padding-right:5%
}

.toolbar{
margin-left:5%;
margin-right:5%
}

.editorWrap{
padding-left:5%;
padding-right:5%
}

.stats{
padding-left:5%;
padding-right:5%
}

.title{
font-size:31px
}

.drawTop{
right:8px;
max-width:calc(100% - 16px)
}

.drawBottom{
max-width:calc(100% - 16px)
}

.templateGrid{
grid-template-columns:1fr
}

}

/* ACCESSIBILITY */

@media(prefers-reduced-motion:reduce){

*,
*::before,
*::after{
animation-duration:.001ms!important;
animation-iteration-count:1!important;
transition-duration:.001ms!important;
scroll-behavior:auto!important
}

}
</style>
</head>

<body>

<div id="intro">
<div class="introCore">

<svg class="introLogo" viewBox="0 0 120 120">
<ellipse
cx="60"
cy="60"
rx="49"
ry="20"
fill="none"
stroke="#707070"
stroke-width="1.4"
transform="rotate(45 60 60)"
/>
<circle cx="60" cy="60" r="16" fill="#202020"/>
<circle cx="60" cy="60" r="10" fill="#f4f4f4"/>
</svg>

<div class="introName">StudyNotes</div>
<div class="introRule"></div>

</div>
</div>

<div id="app">

<aside id="sidebar">

<div class="sideTop">

<div class="brand">

<svg viewBox="0 0 100 100">
<ellipse cx="50" cy="50" rx="39" ry="16" fill="none" stroke="#777" stroke-width="3"/>
<ellipse cx="50" cy="50" rx="39" ry="16" fill="none" stroke="#777" stroke-width="3" transform="rotate(60 50 50)"/>
<ellipse cx="50" cy="50" rx="39" ry="16" fill="none" stroke="#777" stroke-width="3" transform="rotate(120 50 50)"/>
<circle cx="50" cy="50" r="9" fill="#ddd"/>
</svg>

<span>StudyNotes</span>

</div>

<div class="searchWrap">

<div class="searchIcon">⌕</div>

<input
id="search"
class="search"
placeholder="Search notes..."
autocomplete="off"
>

</div>

<script>

const KEY="studynotes_ultra_v2";

const pastelColors=[
"#C8B6E2",
"#B8D8D8",
"#F2C6DE",
"#C7E9B0",
"#F4D6A6",
"#BFD7EA",
"#D8C3A5",
"#C6D8D1",
"#D9C2F0",
"#F1D3B3"
];

let data={
folders:["General","School"],
notes:[],
current:"",
secretFolders:{},
folderColors:{}
};

let currentFolder="General";

let highlighter=false;
let drawTool="pen";
let drawColor="#050505";
let drawing=false;
let drawCanvas=null;
let drawCtx=null;
let undoStack=[];
let redoStack=[];
let preview=false;

/* THEME */

function applyTheme(theme){

if(
theme!=="light" &&
theme!=="dark" &&
theme!=="system"
){
theme="dark";
}

document.documentElement
.setAttribute(
"data-theme",
theme
);

localStorage.setItem(
"studynotes_theme",
theme
);

}

applyTheme(
localStorage.getItem(
"studynotes_theme"
) || "dark"
);

/* HELPERS */

function $(id){
return document.getElementById(id)
}

function uid(){
return Date.now().toString(36)+
Math.random().toString(36).slice(2,8)
}

function codeHash(value){

let hash=0;

for(
let i=0;
i<value.length;
i++
){

hash=((hash<<5)-hash)+
value.charCodeAt(i);

hash|=0

}

return String(hash)
}

function save(){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

$("status").textContent="Saved"

}

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;")

}

function stripHtml(value){

const div=
document.createElement("div");

div.innerHTML=value;

return div.textContent||
div.innerText||
""

}

/* LOAD */

function load(){

try{

const saved=
JSON.parse(
localStorage.getItem(KEY)||"null"
);

if(saved){

data=saved;

if(!Array.isArray(data.folders))
data.folders=["General"];

if(!Array.isArray(data.notes))
data.notes=[];

if(!data.secretFolders)
data.secretFolders={};

if(!data.folderColors)
data.folderColors={};

}

}catch(e){}

if(!Array.isArray(data.folders))
data.folders=["General"];

if(!data.secretFolders)
data.secretFolders={};

if(!data.folderColors)
data.folderColors={};

data.folders.forEach(
(folder,index)=>{

if(
!data.folderColors[folder]
){

data.folderColors[folder]=
pastelColors[
index%pastelColors.length
]

}

});

/* REMOVE OLD STARTER NOTES */

data.notes=
data.notes.filter(n=>{

const title=
(n.title||"")
.trim()
.toLowerCase();

return title!=="welcome" &&
title!=="welcome to studynotes" &&
title!=="start writing"

});

if(!data.notes.length){

const n={
id:uid(),
title:"",
html:"",
folder:data.folders[0]||"General",
pinned:false,
created:Date.now(),
updated:Date.now(),
drawing:""
};

data.notes.push(n);

data.current=n.id

}else{

if(
!data.current ||
!data.notes.some(
n=>n.id===data.current
)
){

data.current=
data.notes[0].id

}

}

currentFolder=
data.notes.find(
n=>n.id===data.current
)?.folder||
data.folders[0]||
"General";

save();
render();

setTimeout(
()=>{
$("intro").classList.add("exit")
},
3000
)

}

/* RENDER */

function render(){

renderFolders();
renderNotes();
renderEditor()

}

/* FOLDERS */

function renderFolders(){

const box=$("folders");

box.innerHTML="";

data.folders.forEach(
(folder,index)=>{

const row=
document.createElement("div");

row.className=
"folder"+
(
currentFolder===folder
?" active":""
);

const color=
data.folderColors?.[folder]||
pastelColors[
index%pastelColors.length
];

row.innerHTML=
'<span class="dot" style="background:'+
color+
';border-color:'+
color+
';box-shadow:0 0 7px '+
color+
'55"></span>'+
'<span class="folderName">'+
escapeHtml(folder)+
'</span>'+
'<button class="folderDel" title="Delete folder">×</button>';

row.onclick=()=>{

if(
data.secretFolders &&
data.secretFolders[folder]
){

if(
!unlockSecretFolder(folder)
)return

}

currentFolder=folder;

renderFolders();
renderNotes()

};

row.querySelector(
".folderDel"
).onclick=e=>{

e.stopPropagation();

deleteFolder(folder)

};

box.appendChild(row)

});

/* PRIVATE */

const pr=
document.createElement("div");

pr.className=
"folder"+
(
currentFolder==="__private__"
?" active":""
);

pr.innerHTML=
'<span class="dot" style="background:#C8B6E2;border-color:#C8B6E2;box-shadow:0 0 7px #C8B6E255"></span>'+
'<span class="folderName">Private</span>';

pr.onclick=
()=>openPrivateFolder();

box.appendChild(pr)

}

/* NOTES */

function renderNotes(){

const box=$("notes");

box.innerHTML="";

const q=
$("search")
.value
.trim()
.toLowerCase();

let notes=
data.notes.filter(
n=>n.folder===currentFolder
);

if(q){

notes=
data.notes.filter(
n=>
(n.title||"")
.toLowerCase()
.includes(q) ||

stripHtml(
n.html||""
)
.toLowerCase()
.includes(q)
)

}

notes
.sort(
(a,b)=>
Number(b.pinned)-
Number(a.pinned)||
b.updated-a.updated
)
.forEach(n=>{

const row=
document.createElement("div");

row.className=
"note"+
(
n.id===data.current
?" active":""
);

row.innerHTML=
'<span class="dot"></span>'+
'<span class="noteName">'+
escapeHtml(
n.title||
"Untitled note"
)+
'</span>'+
(
n.pinned
?
'<span>•</span>'
:""
);

row.onclick=()=>{

data.current=n.id;
currentFolder=n.folder;

save();
render()

};

box.appendChild(row)

})

}

/* EDITOR */

function renderEditor(){

const n=currentNote();

if(!n)return;

$("title").value=
n.title||"";

$("editor").innerHTML=
n.html||"";

$("pinBtn").textContent=
n.pinned
?"★"
:"☆";

updateStats()

}

/* CURRENT */

function currentNote(){

return data.notes.find(
n=>n.id===data.current
)

}

/* NEW NOTE */

function newNote(){

const n={
id:uid(),
title:"",
html:"",
folder:
currentFolder==="__private__"
?"General"
:currentFolder,
pinned:false,
created:Date.now(),
updated:Date.now(),
drawing:""
};

data.notes.unshift(n);

data.current=n.id;

if(
currentFolder==="__private__"
){

currentFolder="General"

}

save();
render();

setTimeout(
()=>{
$("title").focus()
},
50
)

}

/* DELETE */

function deleteNote(){

const n=currentNote();

if(!n)return;

if(
!confirm(
"Delete this note?"
)
)return;

data.notes=
data.notes.filter(
x=>x.id!==n.id
);

let replacement=
data.notes.find(
x=>x.folder===currentFolder
)||
data.notes[0];

if(!replacement){

replacement={
id:uid(),
title:"",
html:"",
folder:data.folders[0]||"General",
pinned:false,
created:Date.now(),
updated:Date.now(),
drawing:""
};

data.notes.push(replacement)

}

data.current=
replacement.id;

currentFolder=
replacement.folder;

save();
render()

}

/* DUPLICATE */

function duplicateNote(){

const n=currentNote();

if(!n)return;

const copy={
...n,
id:uid(),
title:
(n.title||"Untitled note")+
" copy",
created:Date.now(),
updated:Date.now()
};

data.notes.unshift(copy);

data.current=
copy.id;

save();
render()

}

/* PIN */

function togglePin(){

const n=currentNote();

if(!n)return;

n.pinned=!n.pinned;

n.updated=Date.now();

save();

renderNotes();
renderEditor()

}

/* UPDATE */

function update(){

const n=currentNote();

if(!n)return;

n.title=
$("title").value;

n.html=
$("editor").innerHTML;

n.updated=
Date.now();

save();

renderNotes();
updateStats()

}

/* STATS */

function updateStats(){

const text=
stripHtml(
$("editor").innerHTML
).trim();

const words=
text
?
text.split(/\s+/).length
:0;

$("wordCount").textContent=
words+" words";

$("charCount").textContent=
text.length+
" characters";

$("readTime").textContent=
(
words
?
Math.max(
1,
Math.ceil(words/200)
)
:0
)+
" min read"

}

/* TITLE */

$("title").addEventListener(
"input",
update
);

/* EDITOR */

$("editor").addEventListener(
"input",
update
);

/* FORMAT */

function format(
command,
value=null
){

$("editor").focus();

document.execCommand(
command,
false,
value
);

update()

}

/* CHECKLIST */

function insertChecklist(){

$("editor").focus();

document.execCommand(
"insertText",
false,
"☐ "
);

update()

}

/* CODE */

function insertCode(){

$("editor").focus();

const selection=
window.getSelection();

const text=
selection.toString()||
"code";

document.execCommand(
"insertHTML",
false,
"<pre>"+
escapeHtml(text)+
"</pre>"
);

update()

}

/* LINK */

function insertLink(){

const url=
prompt("Link URL:");

if(!url)return;

document.execCommand(
"createLink",
false,
url
);

update()

}

/* TEXT COLOURS */

function showTextColors(){

const box=
$("textColors");

box.classList.toggle(
"show"
);

const button=
document.querySelector(
'[title="Text colour"]'
);

const rect=
button.getBoundingClientRect();

box.style.left=
Math.max(
8,
rect.left
)+"px";

box.style.top=
rect.bottom+
8+
"px"

}

function setTextColor(color){

document.execCommand(
"foreColor",
false,
color
);

$("textColors")
.classList.remove(
"show"
);

update()

}

/* HIGHLIGHTER */

function toggleHighlighter(){

highlighter=
!highlighter;

$("highlightBtn")
.classList
.toggle(
"active",
highlighter
);

$("editor").style.cursor=
highlighter
?"pointer"
:""

}

function wordRangeFromPoint(e){

let node=null;
let offset=0;

if(
document.caretRangeFromPoint
){

const range=
document.caretRangeFromPoint(
e.clientX,
e.clientY
);

if(range){

node=
range.startContainer;

offset=
range.startOffset

}

}else if(
document.caretPositionFromPoint
){

const pos=
document.caretPositionFromPoint(
e.clientX,
e.clientY
);

if(pos){

node=
pos.offsetNode;

offset=
pos.offset

}

}

if(!node)return null;

if(
node.nodeType!==Node.TEXT_NODE
){

if(node.childNodes.length){

node=
node.childNodes[
Math.min(
offset,
node.childNodes.length-1
)
];

if(
