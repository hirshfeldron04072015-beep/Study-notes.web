<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>StudyNotes</title>

<style>
:root{
--bg:#0b0b0b;
--panel:#101010;
--panel2:#171717;
--line:#292929;
--text:#f5f5f5;
--muted:#858585;
--soft:#b8b8b8;
--yellow:#fff200
}

*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
overflow:hidden
}

button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,
input:focus-visible,
[contenteditable]:focus-visible{
outline:2px solid #666;
outline-offset:2px
}

/* INTRO */

#intro{
position:fixed;
inset:0;
z-index:1000;
background:#0b0b0b;
display:grid;
place-items:center;
animation:introHide .8s ease 2.25s forwards
}

.introInner{
display:flex;
flex-direction:column;
align-items:center;
gap:20px
}

.introLogo{
width:120px;
height:120px
}

.introName{
font-size:28px;
font-weight:650;
letter-spacing:-.7px
}

@keyframes introHide{
to{
opacity:0;
visibility:hidden;
pointer-events:none
}
}

/* APP */

#app{
height:100%;
display:flex;
background:var(--bg)
}

/* SIDEBAR */

#sidebar{
width:310px;
min-width:310px;
background:#101010;
border-right:1px solid var(--line);
display:flex;
flex-direction:column;
overflow:hidden;
transition:width .28s ease,min-width .28s ease,transform .28s ease
}

#sidebar.closed{
width:0;
min-width:0;
border-right:0
}

.sideTop{
padding:20px 18px 14px
}

.brand{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:650;
letter-spacing:-.4px;
margin-bottom:20px
}

.brandMark{
width:25px;
height:25px
}

.searchWrap{
position:relative
}

.searchIcon{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#777;
pointer-events:none
}

.search{
width:100%;
height:42px;
border:1px solid #2c2c2c;
background:#171717;
color:#fff;
border-radius:11px;
padding:0 12px 0 37px;
outline:0
}

.search::placeholder{
color:#666
}

.search:focus{
border-color:#555
}

.sideSection{
padding:15px 18px 7px;
color:#686868;
font-size:11px;
font-weight:650;
letter-spacing:1.2px;
text-transform:uppercase
}

.folderList{
padding:0 9px
}

.folderRow{
display:flex;
align-items:center;
gap:9px;
min-height:39px;
padding:0 10px;
border-radius:9px;
color:#cfcfcf;
font-size:14px
}

.folderRow:hover{
background:#191919
}

.folderRow.active{
background:#202020;
color:#fff
}

.folderDot{
width:8px;
height:8px;
border:1px solid #8a8a8a;
border-radius:50%;
flex:0 0 auto
}

.folderName{
flex:1;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.folderDelete{
opacity:0;
border:0;
background:none;
color:#666;
padding:2px 4px
}

.folderRow:hover .folderDelete{
opacity:1
}

.addFolder{
margin:3px 9px 4px;
border:0;
background:transparent;
color:#858585;
text-align:left;
padding:9px 10px;
border-radius:9px;
font-size:13px
}

.addFolder:hover{
background:#191919;
color:#fff
}

.notes{
flex:1;
overflow:auto;
padding:0 9px 10px
}

.noteRow{
padding:11px 10px;
border-radius:9px;
margin:2px 0;
font-size:14px;
color:#bbb;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.noteRow:hover{
background:#191919;
color:#eee
}

.noteRow.active{
background:#252525;
color:#fff
}

.emptyNotes{
padding:18px 10px;
color:#666;
font-size:13px
}

.sideBottom{
border-top:1px solid var(--line);
padding:9px
}

.sideButton{
width:100%;
border:0;
background:transparent;
text-align:left;
padding:9px 10px;
border-radius:8px;
color:#aaa;
font-size:13px
}

.sideButton:hover{
background:#191919;
color:#fff
}

/* MAIN */

#main{
min-width:0;
flex:1;
height:100%;
display:flex;
flex-direction:column
}

.topbar{
height:58px;
min-height:58px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
padding:0 12px;
gap:3px
}

.iconBtn{
width:36px;
height:36px;
border:0;
background:transparent;
border-radius:9px;
display:grid;
place-items:center;
color:#bbb
}

.iconBtn:hover{
background:#191919;
color:#fff
}

.iconBtn svg{
width:18px;
height:18px
}

.status{
margin-left:auto;
color:#666;
font-size:12px;
padding-right:4px
}

/* NOTE */

.noteHeader{
display:flex;
align-items:center;
padding:34px 8% 16px;
gap:12px
}

.title{
flex:1;
min-width:0;
border:0;
outline:0;
background:transparent;
color:#f5f5f5;
font-size:40px;
font-weight:680;
letter-spacing:-1.4px
}

.title::placeholder{
color:#555
}

.pinState{
color:#777;
font-size:16px
}

/* TOOLBAR */

.toolbar{
margin:0 8%;
border-top:1px solid var(--line);
border-bottom:1px solid var(--line);
height:48px;
display:flex;
align-items:center;
gap:2px;
overflow-x:auto
}

.tool{
height:34px;
min-width:34px;
border:0;
background:transparent;
border-radius:8px;
color:#bbb;
display:grid;
place-items:center;
padding:0 9px
}

.tool:hover{
background:#191919;
color:#fff
}

.divider{
width:1px;
height:22px;
background:#292929;
margin:0 5px
}

/* EDITOR */

.editorShell{
position:relative;
flex:1;
min-height:0;
overflow:auto;
padding:28px 8% 80px
}

.editor{
min-height:520px;
outline:0;
color:#eee;
font-size:17px;
line-height:1.72;
letter-spacing:.05px;
caret-color:#fff
}

.editor:empty:before{
content:"Start writing here...";
color:#555
}

.editor h1{
font-size:31px;
line-height:1.2
}

.editor h2{
font-size:24px;
line-height:1.25
}

.editor h3{
font-size:20px
}

.editor pre{
background:#151515;
border:1px solid #292929;
padding:14px;
border-radius:10px;
white-space:pre-wrap
}

.editor blockquote{
border-left:3px solid #666;
padding-left:15px;
color:#aaa
}

.editor a{
color:#fff;
text-decoration:underline
}

.editor mark{
background:#fff200;
color:#111;
padding:0 2px;
border-radius:2px
}

.editor ul{
padding-left:25px
}

/* STATS */

.stats{
height:34px;
min-height:34px;
border-top:1px solid var(--line);
display:flex;
align-items:center;
padding:0 8%;
font-size:11px;
color:#666
}

/* DRAWING */

#drawOverlay{
position:absolute;
inset:0;
display:none;
z-index:20
}

.drawCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
touch-action:none
}

.drawBar{
position:absolute;
left:50%;
bottom:18px;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:5px;
padding:7px;
background:rgba(28,28,28,.96);
border:1px solid #3a3a3a;
border-radius:14px;
box-shadow:0 12px 35px rgba(0,0,0,.4);
backdrop-filter:blur(14px)
}

.drawTool{
height:34px;
border:0;
background:#242424;
border-radius:8px;
padding:0 10px;
font-size:12px;
color:#ccc
}

.drawTool.active{
background:#fff;
color:#111
}

.drawTool:hover{
background:#333;
color:#fff
}

.drawTool.active:hover{
background:#fff;
color:#111
}

.drawColor{
width:24px;
height:24px;
border-radius:50%;
border:2px solid #555;
padding:0
}

.drawColor.selected{
border-color:#fff;
box-shadow:0 0 0 2px #111 inset
}

.cBlack{background:#050505}
.cWhite{background:#fff}
.cRed{background:#ff453a}
.cOrange{background:#ff9f0a}
.cYellow{background:#ffd60a}
.cGreen{background:#30d158}
.cBlue{background:#0a84ff}
.cPurple{background:#bf5af2}
.cPink{background:#ff375f}

.sizeSelect{
background:#242424;
color:#ccc;
border:0;
border-radius:8px;
height:34px;
padding:0 7px
}

.drawClose{
border:0;
background:#fff;
color:#111;
border-radius:8px;
height:34px;
padding:0 11px;
font-weight:600
}

/* TEXT COLOUR */

.popover{
position:fixed;
z-index:500;
display:none;
background:#1a1a1a;
border:1px solid #3a3a3a;
border-radius:12px;
padding:9px;
box-shadow:0 18px 45px #0009

.popover.show{
display:flex;
gap:7px;
flex-wrap:wrap
}

.textColor{
width:27px;
height:27px;
border-radius:50%;
border:2px solid #555

.textBlack{background:#050505}
.textWhite{background:#fff}
.textRed{background:#ff453a}
.textOrange{background:#ff9f0a}
.textYellow{background:#ffd60a}
.textGreen{background:#30d158}
.textBlue{background:#0a84ff}
.textPurple{background:#bf5af2}
.textPink{background:#ff375f}

/* MODAL */

.modal{
position:fixed;
inset:0;
z-index:600;
background:#000a;
display:none;
align-items:center;
justify-content:center;
padding:20px
}

.modal.show{

.modalBox{
width:min(500px,100%);
max-height:88vh;
overflow:auto;
background:#171717;
border:1px solid #383838;
border-radius:16px;
padding:20px

.modalBox h2{
margin:0 0 15px;

.modalBox p{
color:#aaa;

.modalBtn{
border:1px solid #3c3c3c;
background:#222;
color:#eee;
border-radius:8px;
padding:9px 12px;
margin:4px
}

@media(max-width:800px){

#sidebar{
position:fixed;
z-index:100;
left:0;
top:0;
bottom:0;

width:310px;

.noteHeader{
padding-left:5%;

.title{

.editorShell{

padding-right:5%
}

.stats{
padding-left:5%;
padding-right:5%
}

.drawBar{
max-width:96%;
overflow-x:auto
}

}
</style>

<script>

const KEY="studynotes_sleek_v5";

let data={
notes:[],
folders:[],
current:null
};

let currentFolder="__all__";

let savedRange=null;

let drawCanvas=null;

let drawCtx=null;

let drawMode=false;

let drawTool="pen";

let drawColor="#050505";

let undoStack=[];

let redoStack=[];


/* SAVE */

function save(){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

}


/* CURRENT NOTE */

function current(){

return data.notes.find(
n=>n.id===data.current
)||null;

}


/* LOAD */

function load(){

try{

const saved=
JSON.parse(
localStorage.getItem(KEY)
);

if(
saved &&
Array.isArray(saved.notes)
){

data=saved;

}

}catch(e){}

if(!Array.isArray(data.folders))
data.folders=[];

if(!data.notes.length){

data.notes=[
{
id:Date.now(),
title:"Welcome",
html:
"<p>Welcome to <strong>StudyNotes</strong>.</p><p>Start writing here...</p>",
folder:null,
pin:false,
drawing:null
}
];

}

if(!data.current||!current())
data.current=data.notes[0].id;

save();

render();

}


/* RENDER */

function render(){

renderFolders();

renderNotes();

loadEditor();

}


/* FOLDERS */

function renderFolders(){

const box=
document.getElementById("folders");

box.innerHTML="";


const all=
document.createElement("div");

all.className=
"folderRow"+
(currentFolder==="__all__"?" active":"");

all.innerHTML=
'<span class="folderDot"></span>'+
'<span class="folderName">All notes</span>';

all.onclick=()=>{

currentFolder="__all__";

renderFolders();

renderNotes();

};

box.appendChild(all);


data.folders.forEach(f=>{

const row=
document.createElement("div");

row.className=
"folderRow"+
(currentFolder===f?" active":"");

row.innerHTML=
'<span class="folderDot"></span>'+
'<span class="folderName"></span>'+
'<button class="folderDelete" type="button">×</button>';

row.querySelector(
".folderName"
).textContent=f;

row.querySelector(
".folderDelete"
).onclick=e=>{

e.stopPropagation();

deleteFolder(f);

};

row.onclick=()=>{

currentFolder=f;

renderFolders();

renderNotes();

};

box.appendChild(row);

});

}


/* ADD FOLDER */

function addFolder(){

const name=
prompt("Folder name:");

if(!name)return;

const folder=name.trim();

if(!folder)return;

if(data.folders.includes(folder)){

alert(
"That folder already exists."
);

return;

}

data.folders.push(folder);

currentFolder=folder;

save();

renderFolders();

renderNotes();

}


/* DELETE FOLDER */

function deleteFolder(folder){

if(
!confirm(
'Delete folder "'+
folder+
'"? Notes will stay.'
)
)return;

data.folders=
data.folders.filter(
f=>f!==folder
);

data.notes.forEach(n=>{

if(n.folder===folder)
n.folder=null;

});

if(currentFolder===folder)
currentFolder="__all__";

save();

render();

}


/* NOTES */

function renderNotes(){

const box=
document.getElementById("notes");

box.innerHTML="";

const q=
document.getElementById("search")
.value
.trim()
.toLowerCase();

let list=
data.notes

.filter(n=>
currentFolder==="__all__"||
n.folder===currentFolder
)

.filter(n=>
!q||
n.title
.toLowerCase()
.includes(q)||
(n.html||"")
.replace(/<[^>]*>/g," ")
.toLowerCase()
.includes(q)
);

list.sort(
(a,b)=>
Number(b.pin)-
Number(a.pin)||
b.id-a.id
);

if(!list.length){

box.innerHTML=
'<div class="emptyNotes">No notes here yet.</div>';

return;

}

list.forEach(n=>{

const row=
document.createElement("div");

row.className=
"noteRow"+
(n.id===data.current?" active":"");

row.textContent=
(n.pin?"★ ":"")+
(n.title||"Untitled");

row.onclick=()=>{

data.current=n.id;

save();

renderNotes();

loadEditor();

};

box.appendChild(row);

});

}

/* SAVE SELECTION */

function saveSelection(){

const s=
window.getSelection();

if(
s&&
s.rangeCount
){

const r=
s.getRangeAt(0);

if(
document
.getElementById("editor")
.contains(
r.commonAncestorContainer
)
){

savedRange=
r.cloneRange();

}

}

}


/* RESTORE SELECTION */

function restoreSelection(){

if(!savedRange)return;

const s=
window.getSelection();

s.removeAllRanges();

s.addRange(savedRange);

}


/* TRACK SELECTION */

document
.getElementById("editor")

"mouseup",
saveSelection
);

document
.getElementById("editor")

"keyup",
saveSelection

document

saveSelection

document.getElementById(

"h2"
);

if(command==="code")

false,
"pre"

false,

/* CURRENT WORD */

function selectCurrentWord(){

const editor=
document.getElementById(
"editor"
);

editor.focus();

const s=
window.getSelection();

if(
!s||
!s.rangeCount
)return false;

let node=s.anchorNode;

if(!node)return false;

if(node.nodeType!==3)
node=node.firstChild;

if(
!node||
node.nodeType!==3
)
return false;

const text=node.textContent;

let start=s.anchorOffset;

while(
start>0&&
!/\s/.test(
text[start-1]
)
){

start--;

}

let end=s.anchorOffset;

while(
end<text.length&&
!/\s/.test(
text[end]
)
){

end++;

}

if(start===end)
return false;

const range=
document.createRange();

range.setStart(
node,
start
);

range.setEnd(
node,
end
);

s.removeAllRanges();

s.addRange(range);

savedRange=
range.cloneRange();

return true;

}


/* HIGHLIGHT */

function highlightSelection(){

restoreSelection();

const s=
window.getSelection();

if(
!s||
s.isCollapsed
){

if(
!selectCurrentWord()
)
return;

}

document.execCommand(
"hiliteColor",
false,
"#fff200"
);

document.execCommand(
"backColor",

}

/* DRAWING */

function openDrawing(){

if(drawMode)return;

drawMode=true;

const overlay=
document.getElementById(
"drawOverlay"
);

overlay.style.display="block";

drawCanvas=
document.getElementById(
"drawCanvas"
);

const shell=
document.getElementById(
"editorShell"
);

drawCanvas.width=
shell.clientWidth;

drawCanvas.height=
shell.clientHeight;

drawCtx=
drawCanvas.getContext("2d");

drawCtx.lineCap="round";

drawCtx.lineJoin="round";

undoStack=[];

redoStack=[];

saveDrawState();

drawCanvas.onpointerdown=
drawStart;

drawCanvas.onpointermove=
drawMove;

drawCanvas.onpointerup=
drawEnd;

drawCanvas.onpointercancel=
drawEnd;

drawCanvas.onpointerleave=
drawEnd;

const n=current();

if(
n&&
n.drawing
){

const image=
new Image();

image.onload=()=>{

drawCtx.drawImage(
image,
0,
0
);

};

image.src=n.drawing;

}

}


/* DRAW START */

function drawStart(e){

drawCanvas
.setPointerCapture?.(
e.pointerId
);

drawCtx.beginPath();

const p=
point(e);

drawCtx.moveTo(
p.x,
p.y
);

drawCanvas._down=true;

}


/* DRAW MOVE */

function drawMove(e){

if(
!drawCanvas||
!drawCanvas._down
)
return;

const p=
point(e);

drawCtx.globalCompositeOperation=
drawTool==="eraser"
?"destination-out"
:"source-over";

let size=
Number(
document.getElementById(
"drawSize"
).value
);

if(drawTool==="pencil")
size=Math.max(
1,
size/2
);

if(drawTool==="marker")
size*=3;

drawCtx.lineWidth=size;

drawCtx.globalAlpha=
drawTool==="marker"
?.35
:1;

drawCtx.strokeStyle=
drawColor;

drawCtx.lineTo(
p.x,
p.y
);

drawCtx.stroke();

}


/* DRAW END */

function drawEnd(){

if(
!drawCanvas||
!drawCanvas._down
)
return;

drawCanvas._down=false;

drawCtx.globalAlpha=1;

drawCtx.globalCompositeOperation=
"source-over";

saveDrawState();

persistDrawing();

}


/* DRAW POSITION */

function point(e){

const r=
drawCanvas.getBoundingClientRect();

return{

x:e.clientX-r.left,

y:e.clientY-r.top

};

}


/* DRAW TOOL */

function setDrawTool(tool){

drawTool=tool;

document
.querySelectorAll(
"[data-drawtool]"
)
.forEach(
b=>
b.classList.toggle(
"active",
b.dataset.drawtool===tool
)
);

}


/* DRAW COLOUR */

function setDrawColor(
color,
element
){

drawColor=color;

document
.querySelectorAll(
".drawColor"
)
.forEach(
b=>
b.classList.remove(
"selected"
)
);

if(element)
element.classList.add(
"selected"
);

if(
drawTool==="eraser"
)
setDrawTool("pen");

}


/* DRAW STATE */

function saveDrawState(){

if(!drawCanvas)return;

undoStack.push(
drawCanvas.toDataURL()
);

if(
undoStack.length>25
)
undoStack.shift();

redoStack=[];

}


/* RESTORE DRAW */

function restoreDraw(src){

const image=
new Image();

image.onload=()=>{

drawCtx.clearRect(
0,
0,
drawCanvas.width,
drawCanvas.height
);

drawCtx.drawImage(
image,
0,
0
);

persistDrawing();

};

image.src=src;

}


/* UNDO */

function undoDraw(){

if(
undoStack.length<2
)
return;

redoStack.push(
undoStack.pop()
);

restoreDraw(
undoStack[
undoStack.length-1
]
);

}


/* REDO */

function redoDraw(){

if(!redoStack.length)
return;

const state=
redoStack.pop();

undoStack.push(state);

restoreDraw(state);

}


/* SAVE DRAWING */

function persistDrawing(){

const n=current();

if(
n&&
drawCanvas
){

n.drawing=
drawCanvas.toDataURL();

save();

}

}


/* CLOSE DRAWING */

function closeDrawing(){

persistDrawing();

drawMode=false;

document.getElementById(
"drawOverlay"
).style.display="none";

}


/* STATS */

function updateStats(){

const text=
document.getElementById(
"editor"
).innerText.trim();

const words=
text
?text.split(/\s+/).length
:0;

const chars=text.length;

const mins=
Math.max(
0,
Math.ceil(
words/200
)
);

document.getElementById(
"stats"
).textContent=
words+
" words · "+
chars+
" characters · "+
mins+
" min read";

}

"keydown",
e=>{

const modifier=
e.metaKey||
e.ctrlKey;

if(
modifier&&
e.key.toLowerCase()==="n"
){

e.preventDefault();

newNote();

}

if(
modifier&&
e.key.toLowerCase()==="s"
){

e.preventDefault();

update();

}

modifier&&
e.key.toLowerCase()==="f"
){

document
.getElementById("search")
.focus();

}

closeModal();

.getElementById("textColors")
.classList.remove(
"show"
);

}

}
);
