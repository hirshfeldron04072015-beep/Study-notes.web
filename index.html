<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
name="theme-color"
content="#070707"
>

<title>StudyNotes</title>

<style>

:root{

--bg:#070707;

--surface:#0d0d0d;

--surface2:#141414;

--surface3:#1b1b1b;

--line:#262626;

--text:#f3f3f3;

--muted:#737373;

--soft:#aaa;

--highlight:#c9c35b;

--ease:cubic-bezier(.2,.8,.2,1)

}

*{box-sizing:border-box}

html,body{

margin:0;

width:100%;

height:100%;

background:var(--bg);

color:var(--text);

font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;

overflow:hidden

}

button,input,select{font:inherit}

button{border:0;cursor:pointer;color:inherit}

button:focus-visible,

input:focus-visible,

[contenteditable]:focus-visible{

outline:2px solid #686868;

outline-offset:2px

}

/* INTRO */

#intro{

position:fixed;

inset:0;

z-index:9999;

display:grid;

place-items:center;

background:#070707;

overflow:hidden

}

#intro:before,

#intro:after{

content:"";

position:absolute;

border:1px solid #252525;

border-radius:50%;

width:240px;

height:240px;

opacity:0;

animation:orbitGlow 2.4s var(--ease) .1s forwards

}

#intro:after{

width:420px;

height:420px;

animation-delay:.25s

}

.introCore{

position:relative;

z-index:2;

display:flex;

flex-direction:column;

align-items:center;

gap:18px;

animation:introCore 1.25s var(--ease) forwards

}

.introLogo{

width:132px;

height:132px;

filter:drop-shadow(0 0 28px #fff1)

}

.introName{

font-size:29px;

font-weight:650;

letter-spacing:-.8px

}

.introRule{

width:0;

height:1px;

background:#666;

animation:introRule 1s ease .55s forwards

}

#intro.exit{

animation:introExit 1.15s var(--ease) forwards

}

@keyframes introCore{

from{

opacity:0;

transform:scale(.72) translateY(18px);

filter:blur(9px)

}

to{

opacity:1;

transform:none;

filter:none

}

}

@keyframes introRule{

to{width:115px}

}

@keyframes orbitGlow{

from{

opacity:0;

transform:scale(.55)

}

60%{opacity:.7}

to{

opacity:0;

transform:scale(1.35)

}

}

@keyframes introExit{

0%{

opacity:1;

transform:scale(1)

}

35%{

opacity:1;

transform:scale(1.035)

}

100%{

opacity:0;

transform:scale(1.13);

visibility:hidden;

pointer-events:none

}

}

/* APP */

#app{

height:100%;

display:flex;

background:var(--bg)

}

/* SIDEBAR */

#sidebar{

width:300px;

min-width:300px;

background:linear-gradient(180deg,#101010,#0b0b0b);

border-right:1px solid var(--line);

display:flex;

flex-direction:column;

overflow:hidden;

transition:

width .38s var(--ease),

min-width .38s var(--ease),

transform .38s var(--ease),

opacity .25s

}

#sidebar.closed{

width:0;

min-width:0;

border-right:0;

opacity:.2

}

.sideTop{

padding:20px 17px 12px

}

.brand{

display:flex;

align-items:center;

gap:10px;

font-size:19px;

font-weight:650;

margin-bottom:19px

}

.brand svg{

width:27px;

height:27px;

flex:none

}

.searchWrap{

position:relative

}

.searchIcon{

position:absolute;

left:13px;

top:10px;

color:#686868;

pointer-events:none

}

.search{

width:100%;

height:42px;

border:1px solid #292929;

background:#151515;

color:#eee;

border-radius:12px;

padding:0 12px 0 36px;

outline:0;

transition:border-color .2s,box-shadow .2s

}

.search:focus{

border-color:#4b4b4b;

box-shadow:0 0 0 4px #fff08

}

.search::placeholder{

color:#5c5c5c

}

.sideTitle{

padding:15px 17px 7px;

color:#626262;

font-size:10px;

font-weight:700;

letter-spacing:1.2px;

text-transform:uppercase

}

.folders{

max-height:230px;

overflow:auto;

padding:0 8px

}

.notes{

flex:1;

overflow:auto;

padding:0 8px 10px

}

.folder,

.note{

display:flex;

align-items:center;

min-height:40px;

padding:0 10px;

border-radius:9px;

margin:2px 0;

color:#a9a9a9;

font-size:14px;

transition:

background .18s,

color .18s,

transform .18s

}

.folder:hover,

.note:hover{

background:#181818;

color:#eee;

transform:translateX(1px)

}

.folder.active,

.note.active{

background:#232323;

color:#fff

}

.dot{

width:7px;

height:7px;

border:1px solid #888;

border-radius:50%;

margin-right:9px;

flex:none

}

.folderName,

.noteName{

flex:1;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap

}

.folderDel{

opacity:0;

background:none;

color:#555;

padding:4px 5px

}

.folder:hover .folderDel{

opacity:1

}

.addFolder,

.sideButton{

width:100%;

background:none;

color:#777;

text-align:left;

padding:9px 10px;

border-radius:8px;

transition:

background .18s,

color .18s

}

.addFolder:hover,

.sideButton:hover{

background:#181818;

color:#eee

}

.sideBottom{

border-top:1px solid var(--line);

padding:8px

}

/* MAIN */

#main{

min-width:0;

flex:1;

height:100%;

display:flex;

flex-direction:column

}

.topbar{

height:58px;

min-height:58px;

border-bottom:1px solid var(--line);

display:flex;

align-items:center;

gap:3px;

padding:0 12px

}

.icon{

width:37px;

height:37px;

background:none;

border-radius:10px;

color:#999;

display:grid;

place-items:center;

transition:

background .18s,

color .18s,

transform .18s

}

.icon:hover{

background:#191919;

color:#fff;

transform:translateY(-1px)

}

.icon.active{

background:#252525;

color:#fff

}

.status{

margin-left:auto;

color:#5d5d5d;

font-size:11px;

padding-right:5px

}

/* TITLE */

.noteHeader{

display:flex;

align-items:center;

padding:34px 8% 15px

}

.title{

flex:1;

min-width:0;

border:0;

outline:0;

background:transparent;

color:#f4f4f4;

font-size:40px;

font-weight:680;

letter-spacing:-1.5px

}

.title::placeholder{

color:#4e4e4e

}

.pin{

color:#777;

margin-left:10px

}

/* TOOLBAR */

.toolbar{

margin:0 8%;

height:49px;

border-top:1px solid var(--line);

border-bottom:1px solid var(--line);

display:flex;

align-items:center;

gap:2px;

overflow-x:auto

}

.tool{

height:34px;

min-width:34px;

padding:0 9px;

background:none;

border-radius:8px;

color:#999;

display:grid;

place-items:center;

transition:

background .18s,

color .18s,

transform .18s

}

.tool:hover{

background:#191919;

color:#fff;

transform:translateY(-1px)

}

.tool.active{

background:#eee;

color:#111

}

.sep{

width:1px;

height:22px;

background:#292929;

margin:0 5px;

flex:none

}

/* EDITOR */

.editorWrap{

position:relative;

flex:1;

min-height:0;

overflow:auto;

padding:28px 8% 75px

}

.editor{

min-height:520px;

outline:0;

color:#e8e8e8;

font-size:17px;

line-height:1.76;

caret-color:#fff;

transition:opacity .2s

}

.editor:empty:before{

content:"Start writing here...";

color:#4d4d4d

}

.editor h1{

font-size:33px;

line-height:1.18

}

.editor h2{

font-size:25px;

line-height:1.25

}

.editor h3{

font-size:20px

}

.editor pre{

background:#121212;

border:1px solid #292929;

border-radius:11px;

padding:15px;

white-space:pre-wrap

}

.editor blockquote{

border-left:3px solid #626262;

padding-left:15px;

color:#aaa

}

.editor a{

color:#eee

}

.editor mark{

background:var(--highlight);

color:#111;

padding:0 2px;

border-radius:3px

}

.editor table{

border-collapse:collapse;

width:100%

}

.editor td{

border:1px solid #333;

padding:12px;

vertical-align:top

}

.stats{

height:34px;

min-height:34px;

border-top:1px solid var(--line);

display:flex;

align-items:center;

padding:0 8%;

font-size:11px;

color:#606060

}

/* POPUPS */

.pop{

position:fixed;

z-index:500;

display:none;

background:rgba(23,23,23,.96);

border:1px solid #3a3a3a;

border-radius:14px;

padding:9px;

box-shadow:0 20px 60px #000b;

backdrop-filter:blur(20px);

gap:7px;

flex-wrap:wrap;

animation:popIn .18s var(--ease)

}

.pop.show{

display:flex

}

@keyframes popIn{

from{

opacity:0;

transform:translateY(-5px) scale(.96)

}

to{

opacity:1;

transform:none

}

}

/* TEXT COLOUR */

.swatch{

width:28px;

height:28px;

border-radius:50%;

border:2px solid #555

}

.sblack{background:#050505}

.swhite{background:#fff}

.sred{background:#ff453a}

.sorange{background:#ff9f0a}

.syellow{background:#ffd60a}

.sgreen{background:#30d158}

.sblue{background:#0a84ff}

.spurple{background:#bf5af2}

.spink{background:#ff375f}

/* DRAWING */

#drawOverlay{

position:absolute;

inset:0;

z-index:200;

display:none;

background:rgba(0,0,0,.10);

backdrop-filter:blur(2px);

-webkit-backdrop-filter:blur(2px)

}

.drawCanvas{

position:absolute;

inset:0;

width:100%;

height:100%;

touch-action:none

}

.drawTop{

position:absolute;

top:16px;

left:16px;

right:16px;

transform:none;

display:flex;

align-items:center;

justify-content:flex-end;

gap:6px;

padding:8px;

background:rgba(28,28,30,.72);

border:1px solid rgba(255,255,255,.12);

border-radius:22px;

box-shadow:0 18px 55px rgba(0,0,0,.45);

backdrop-filter:blur(28px);

-webkit-backdrop-filter:blur(28px);

overflow:visible;

animation:topPaletteIn .28s var(--ease)

}

.drawBottom{

position:absolute;

bottom:18px;

left:50%;

transform:translateX(-50%);

display:flex;

align-items:center;

gap:8px;

padding:8px 10px;

background:rgba(28,28,30,.82);

border:1px solid rgba(255,255,255,.13);

border-radius:26px;

box-shadow:0 22px 70px rgba(0,0,0,.55);

backdrop-filter:blur(30px);

-webkit-backdrop-filter:blur(30px);

overflow:visible;

animation:paletteIn .32s var(--ease)

}

.drawTool{

width:46px;

height:46px;

padding:0;

border-radius:50%;

background:rgba(255,255,255,.08);

color:#bdbdbd;

font-size:20px;

display:grid;

place-items:center;

transition:

transform .22s var(--ease),

background .22s,

color .22s,

box-shadow .22s

}

.drawTool:hover{

background:rgba(255,255,255,.15);

color:#fff;

transform:translateY(-2px) scale(1.04)

}

.drawTool.active{

background:#f5f5f5;

color:#111;

box-shadow:0 4px 16px rgba(255,255,255,.13);

transform:scale(1.06)

}

.drawTool[data-draw]{

font-size:0

}

.drawTool[data-draw="pen"]::before{

content:"✒";

font-size:20px

}

.drawTool[data-draw="pencil"]::before{

content:"✎";

font-size:21px

}

.drawTool[data-draw="marker"]::before{

content:"▰";

font-size:18px

}

.drawTool[data-draw="ruler"]::before{

content:"╱";

font-size:22px

}

.drawTool[data-draw="eraser"]::before{

content:"▱";

font-size:20px

}

.drawTop .drawTool{

width:42px;

height:42px

}

.drawColor{

width:25px;

height:25px;

border-radius:50%;

border:2px solid rgba(255,255,255,.25);

flex:none;

transition:

transform .2s var(--ease),

border .2s,

box-shadow .2s

}

.drawColor:hover{

transform:scale(1.15)

}

.drawColor.selected{

border-color:#fff;

box-shadow:

0 0 0 2px rgba(0,0,0,.55),

0 0 0 3px rgba(255,255,255,.2);

transform:scale(1.13)

}

.cBlack{background:#050505}

.cWhite{background:#fff}

.cRed{background:#ff453a}

.cOrange{background:#ff9f0a}

.cYellow{background:#ffd60a}

.cGreen{background:#30d158}

.cBlue{background:#0a84ff}

.cPurple{background:#bf5af2}

.cPink{background:#ff375f}

.size{

height:42px;

min-width:72px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.08);

color:#ddd;

border-radius:21px;

padding:0 12px

}

.drawClose{

background:#f5f5f5!important;

color:#111!important;

width:48px!important;

height:48px!important;

font-size:0!important

}

.drawClose::before{

content:"✓";

font-size:20px

}

.drawExit{

font-size:22px!important;

background:rgba(255,255,255,.08)!important;

color:#fff!important

}

@keyframes paletteIn{

from{

opacity:0;

transform:translateX(-50%) translateY(12px) scale(.94)

}

to{

opacity:1;

transform:translateX(-50%) translateY(0) scale(1)

}

}

@keyframes topPaletteIn{

from{

opacity:0;

transform:translateY(-8px) scale(.96)

}

to{

opacity:1;

transform:none

}

}

/* RULER */

.ruler{

position:absolute;

z-index:3;

left:20%;

top:30%;

width:360px;

height:48px;

border-radius:9px;

background:linear-gradient(#4b4b4b,#292929);

border:1px solid #777;

box-shadow:0 12px 35px #000b;

display:none;

align-items:flex-end;

justify-content:space-around;

padding:0 10px 7px;

color:#bbb;

font-size:9px;

cursor:grab;

touch-action:none

}

.ruler.show{

display:flex

}

.ruler:before{

content:"";

position:absolute;

left:10px;

right:10px;

top:9px;

height:1px;

background:#777;

box-shadow:

0 8px #666,

0 16px #666,

0 24px #666

}

.ruler:active{

cursor:grabbing

}

/* FOLDER ACTIONS */

.folderActions{

display:flex;

align-items:center;

gap:2px;

opacity:0;

transition:opacity .18s

}

.folder:hover .folderActions,

.folder.active .folderActions{

opacity:1

}

.folderAction{

width:27px;

height:27px;

border-radius:7px;

background:transparent;

color:#666;

font-size:15px

}

.folderAction:hover{

background:#2b2b2b;

color:#fff

}

/* PRIVATE */

.privateGate{

display:grid;

place-items:center;

min-height:260px;

text-align:center;

padding:30px

}

.privateIcon{

font-size:36px;

margin-bottom:12px

}

.privateGate h3{

margin:0 0 8px;

font-size:21px

}

.privateGate p{

color:#777;

margin:0 0 18px

}

.privateInput{

width:220px;

height:44px;

border:1px solid #333;

background:#111;

color:#fff;

border-radius:12px;

text-align:center;

outline:0

}

.privateInput:focus{

border-color:#666;

box-shadow:0 0 0 4px #fff08

}

.privateBtn{

margin-top:10px;

padding:10px 18px;

border-radius:11px;

background:#eee;

color:#111

}

/* MODALS */

.modal{

position:fixed;

inset:0;

z-index:800;

display:none;

place-items:center;

background:rgba(0,0,0,.58);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px)

}

.modal.show{

display:grid

}

.modalBox{

width:min(760px,92vw);

max-height:84vh;

overflow:auto;

background:#111;

border:1px solid #303030;

border-radius:18px;

box-shadow:0 30px 90px #000c;

animation:modalIn .22s var(--ease)

}

@keyframes modalIn{

from{

opacity:0;

transform:translateY(12px) scale(.97)

}

to{

opacity:1;

transform:none

}

}

.modalHead{

display:flex;

align-items:center;

justify-content:space-between;

padding:18px 20px;

border-bottom:1px solid #292929

}

.modalHead h2{

margin:0;

font-size:20px

}

.close{

width:34px;

height:34px;

border-radius:50%;

background:#222;

color:#aaa;

font-size:20px

}

.close:hover{

background:#333;

color:#fff

}

.settingRow{

padding:16px 20px;

border-bottom:1px solid #242424;

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

color:#aaa

}

.settingRow button{

background:#252525;

padding:9px 13px;

border-radius:9px;

color:#eee

}

.helpText{

padding:20px;

color:#aaa;

line-height:1.7

}

.templateGrid{

padding:20px;

display:grid;

grid-template-columns:repeat(2,1fr);

gap:14px

}

.templateCard{

text-align:left;

background:#171717;

border:1px solid #2b2b2b;

border-radius:14px;

padding:12px;

transition:.2s

}

.templateCard:hover{

background:#202020;

transform:translateY(-2px);

border-color:#444

}

.templatePreview{

height:120px;

background:#0d0d0d;

border:1px solid #282828;

border-radius:10px;

padding:14px;

display:grid;

gap:7px;

margin-bottom:10px

}

.templatePreview span{

height:6px;

background:#555;

border-radius:5px

}

.templateName{

font-weight:650;

margin-bottom:4px

}

.templateDesc{

font-size:11px;

color:#707070;

line-height:1.4

}

.shapeDaily{

grid-template-rows:14px 7px 1fr 7px 1fr 7px

}

.shapeCornell{

grid-template-columns:35% 1fr

}

.shapeExam{

grid-template-columns:1fr 1fr

}

.shapeEssay{

grid-template-columns:1fr

}

.shapeProject{

grid-template-columns:1fr 1fr

}

.shapeFlash{

grid-template-columns:1fr 1fr

}

/* RESPONSIVE */

@media(max-width:800px){

#sidebar{

width:260px;

min-width:260px

}

.noteHeader{

padding-left:5%;

padding-right:5%

}

.title{

font-size:30px

}

.toolbar{

margin-left:5%;

margin-right:5%

}

.editorWrap{

padding-left:5%;

padding-right:5%

}

.stats{

padding-left:5%;

padding-right:5%

}

.templateGrid{

grid-template-columns:1fr 1fr

}

.drawTop,

.drawBottom{

max-width:95%

}

}

@media(max-width:500px){

.templateGrid{

grid-template-columns:1fr

}

.noteHeader{

padding-top:24px

}

.drawBottom{

gap:5px;

padding:7px;

bottom:10px

}

.drawTool{

width:40px;

height:40px

}

.drawColor{

width:22px;

height:22px

}

.size{

min-width:60px

}

}

/* STARTUP FALLBACK */

#intro{

animation:introAutoExit 1.15s var(--ease) 3.1s forwards

}

@keyframes introAutoExit{

0%{

opacity:1;

transform:scale(1);

visibility:visible

}

100%{

opacity:0;

transform:scale(1.13);

visibility:hidden;

pointer-events:none

}

}

</style>

</head>

<body>

<!-- INTRO -->

<div id="intro">

<div class="introCore">

<svg
class="introLogo"
viewBox="0 0 120 120"
>

<ellipse
cx="60"
cy="60"
rx="49"
ry="20"
fill="none"
stroke="#707070"
stroke-width="1.4"
transform="rotate(45 60 60)"
/>

<circle
cx="60"
cy="60"
r="16"
fill="#202020"
/>

<circle
cx="60"
cy="60"
r="10"
fill="#f4f4f4"
/>

</svg>

<div class="introName">
StudyNotes
</div>

<div class="introRule"></div>

</div>

</div>

<!-- APP -->

<div id="app">

<aside id="sidebar">

<div class="sideTop">

<div class="brand">

<svg
viewBox="0 0 40 40"
>

<ellipse
cx="20"
cy="20"
rx="16"
ry="7"
fill="none"
stroke="#777"
/>

<ellipse
cx="20"
cy="20"
rx="16"
ry="7"
fill="none"
stroke="#777"
transform="rotate(60 20 20)"
/>

<ellipse
cx="20"
cy="20"
rx="16"
ry="7"
fill="none"
stroke="#777"
transform="rotate(120 20 20)"
/>

<circle
cx="20"
cy="20"
r="5"
fill="#eee"
/>

</svg>

<span>studynotes</span>

</div>

<div class="searchWrap">

<span class="searchIcon">
⌕
</span>

<input
id="search"
class="search"
placeholder="Search your notes"
autocomplete="off"
/>

</div>

</div>

<div class="sideTitle">
Your space
</div>

<div
id="folders"
class="folders"
></div>

<button
class="addFolder"
onclick="addFolder()"
>
＋ Add folder
</button>

<div class="sideTitle">
Notes
</div>

<div

<script>

const KEY="studynotes_ultra_v2";

let data={

notes:[],

folders:[],

current:null

};

let currentFolder="__all__";

let savedRange=null;

let highlighter=false;

let drawCanvas=null;

let drawCtx=null;

let drawTool="pen";

let drawColor="#050505";

let drawing=false;

let undoStack=[];

let redoStack=[];

/* HELPERS */

function $(id){

return document.getElementById(id)

}

function currentNote(){

return data.notes.find(

n=>n.id===data.current

)||null

}

function save(){

localStorage.setItem(

KEY,

JSON.stringify(data)

)

}

function stripHTML(html){

const div=document.createElement("div");

div.innerHTML=html||"";

return div.textContent||""

}

/* LOAD */

function load(){

try{

const saved=

JSON.parse(

localStorage.getItem(KEY)

);

if(

saved &&

Array.isArray(saved.notes)

){

data=saved

}

}catch(e){}

if(

!Array.isArray(data.folders)

){

data.folders=[]

}

if(!Array.isArray(data.notes)){

data.notes=[]

}

data.notes.forEach(

n=>{

if(n.folder==="__private__"){

n.private=true;

n.folder=null

}

if(typeof n.private!=="boolean"){

n.private=false

}

}

);

if(!data.notes.length){

data.notes=[

{

id:Date.now(),

title:"Welcome",

html:

"<p>Welcome to <strong>StudyNotes</strong>.</p><p>Everything you write here is saved automatically.</p>",

folder:null,

pin:false,

private:false,

drawing:null

}

]

}

if(

!data.current ||

!currentNote()

){

data.current=

data.notes[0].id

}

save();

render();

setTimeout(

()=>{

$("intro").classList.add("exit")

},

3000

)

}

/* RENDER */

function render(){

renderFolders();

renderNotes();

loadEditor()

}

/* FOLDERS */

function renderFolders(){

const box=$("folders");

box.innerHTML="";

const all=document.createElement("div");

all.className=

"folder"+

(

currentFolder==="__all__"

?" active"

:""

);

all.innerHTML=

'<span class="dot"></span><span class="folderName">All notes</span>';

all.onclick=()=>{

currentFolder="__all__";

renderFolders();

renderNotes()

};

box.appendChild(all);

const privateRow=document.createElement("div");

privateRow.className=

"folder"+

(

currentFolder==="__private__"

?" active"

:""

);

privateRow.innerHTML=

'<span class="dot"></span><span class="folderName">Private</span><span class="folderActions"><button class="folderAction" title="Private">⌘</button></span>';

privateRow.onclick=()=>{

openPrivateFolder()

};

box.appendChild(privateRow);

data.folders.forEach(

f=>{

const row=document.createElement("div");

row.className=

"folder"+

(

currentFolder===f

?" active"

:""

);

row.innerHTML=

'<span class="dot"></span><span class="folderName"></span><span class="folderActions"><button class="folderAction" title="Rename">✎</button><button class="folderAction" title="Delete">×</button></span>';

row.querySelector(

".folderName"

).textContent=f;

const actions=

row.querySelectorAll(

".folderAction"

);

actions[0].onclick=e=>{

e.stopPropagation();

renameFolder(f)

};

actions[1].onclick=e=>{

e.stopPropagation();

deleteFolder(f)

};

row.ondblclick=e=>{

e.stopPropagation();

renameFolder(f)

};

row.onclick=()=>{

currentFolder=f;

renderFolders();

renderNotes()

};

box.appendChild(row)

}

)

}

/* ADD FOLDER */

function addFolder(){

const value=

prompt("Folder name:");

if(!value)return;

const folder=

value.trim();

if(!folder)return;

if(

data.folders.includes(folder)

){

alert(

"That folder already exists."

);

return

}

data.folders.push(folder);

currentFolder=folder;

save();

renderFolders();

renderNotes()

}

/* DELETE FOLDER */

function deleteFolder(folder){

if(

!confirm(

'Delete folder "'+

folder+

'"? Notes will stay.'

)

)

return;

data.folders=

data.folders.filter(

f=>f!==folder

);

data.notes.forEach(

n=>{

if(n.folder===folder)

n.folder=null

}

);

if(

currentFolder===folder

){

currentFolder="__all__"

}

save();

render()

}

/* PRIVATE FOLDER */

function codeHash(value){

let h=2166136261;

for(

let i=0;

i<value.length;

i++

){

h^=

value.charCodeAt(i);

h=

Math.imul(

h,

16777619

)

}

return(

h>>>0

).toString(16)

}

function privateCode(){

return localStorage.getItem(

KEY+"_private_code"

)||""

}

function openPrivateFolder(){

const existing=

privateCode();

const body=

existing

?

'<div class="privateGate"><div><div class="privateIcon">⌘</div><h3>Private</h3><p>Enter your private code.</p><input id="privateCodeInput" class="privateInput" type="password" inputmode="numeric" maxlength="12" placeholder="Code"><br><button class="privateBtn" onclick="unlockPrivate()">Unlock</button></div></div>'

:

'<div class="privateGate"><div><div class="privateIcon">⌘</div><h3>Create your private code</h3><p>Choose a code for your private notes.</p><input id="privateCodeInput" class="privateInput" type="password" inputmode="numeric" maxlength="12" placeholder="New code"><br><button class="privateBtn" onclick="createPrivateCode()">Create code</button></div></div>';

openModal(

"Private",

body

);

setTimeout(

()=>$("privateCodeInput")?.focus(),

80

)

}

function createPrivateCode(){

const input=

$("privateCodeInput");

if(

!input||

!input.value.trim()

){

return alert(

"Enter a code first."

)

}

localStorage.setItem(

KEY+"_private_code",

codeHash(

input.value.trim()

)

);

closeModal();

currentFolder="__private__";

renderFolders();

renderNotes()

}

function unlockPrivate(){

const input=

$("privateCodeInput");

if(!input)return;

if(

codeHash(

input.value.trim()

)!

==

privateCode()

){

input.value="";

return alert(

"Wrong code."

)

}

closeModal();

currentFolder="__private__";

renderFolders();

renderNotes()

}

function renameFolder(folder){

const value=

prompt(

"Rename folder:",

folder

);

if(value===null)return;

const next=

value.trim();

if(!next||next===folder)return;

if(

data.folders.includes(next)

){

return alert(

"That folder already exists."

)

}

data.folders=

data.folders.map(

f=>f===folder

?next

:f

);

data.notes.forEach(

n=>{

if(n.folder===folder)

n.folder=next

}

);

if(

currentFolder===folder

){

currentFolder=next

}

save();

render()

}

/* NOTES */

function renderNotes(){

const box=

$("notes");

box.innerHTML="";

const query=

$("search")

.value

.trim()

.toLowerCase();

let list=

data.notes.filter(

n=>

(

currentFolder==="__private__"

?

n.private===true

:

n.private!==true

)

&&

(

currentFolder==="__all__"||

n.folder===currentFolder

)

)

.filter(

n=>

!query||

(n.title||"Untitled")

.toLowerCase()

.includes(query)||

(n.html||"")

.replace(/<[^>]*>/g," ")

.toLowerCase()

.includes(query)

);

list.sort(

(a,b)=>

Number(b.pin)-

Number(a.pin)||

b.id-a.id

);

if(!list.length){

box.innerHTML=

'<div style="padding:18px 10px;color:#666;font-size:13px">No notes here yet.</div>';

return

}

list.forEach(

n=>{

const row=

document.createElement("div");

row.className=

"note"+

(

n.id===data.current

?" active"

:""

);

row.innerHTML=

'<span class="noteName"></span>';

row.querySelector(

".noteName"

).textContent=

(

n.pin

?"★ "

:""

)+

(n.title||"Untitled");

row.onclick=()=>{

data.current=n.id;

save();

renderNotes();

loadEditor()

};

box.appendChild(row)

}

)

}

/* EDITOR */

function loadEditor(){

const n=currentNote();

if(!n)return;

$("title").value=

n.title||"";

$("editor").innerHTML=

n.html||"";

$("pinState").textContent=

n.pin

?"★"

:"";

updateStats()

}

/* UPDATE */

function update(){

const n=currentNote();

if(!n)return;

n.title=

$("title").value;

n.html=

$("editor").innerHTML;

$("status").textContent=

"Saved";

save();

updateStats();

renderNotes()

}

/* STATS */

function updateStats(){

const text=

stripHTML(

$("editor").innerHTML

);

const words=

text.trim()

?

text.trim().split(/\s+/).length

:

0;

const chars=

text.length;

const mins=

words

?

Math.max(

1,

Math.ceil(words/200)

)

:

0;

$("stats").textContent=

words+

" words · "+

chars+

" characters · "+

mins+

" min read"

}

/* SELECTION */

function saveSelection(){

const sel=

getSelection();

if(

sel &&

sel.rangeCount

){

savedRange=

sel.getRangeAt(0).cloneRange()

}

}

function restoreSelection(){

const editor=

$("editor");

editor.focus();

if(!savedRange)return;

const sel=

getSelection();

sel.removeAllRanges();

sel.addRange(savedRange)

}

/* FORMAT */

function format(type){

saveSelection();

restoreSelection();

if(type==="bold"){

document.execCommand(

"bold",

false,

null

)

}

if(type==="italic"){

document.execCommand(

"italic",

false,

null

)

}

if(type==="underline"){

document.execCommand(

"underline",

false,

null

)

}

if(type==="h2"){

document.execCommand(

"formatBlock",

false,

"h2"

)

}

if(type==="check"){

document.execCommand(

"insertText",

false,

"☐ "

)

}

if(type==="code"){

document.execCommand(

"formatBlock",

false,

"pre"

)

}

update();

saveSelection()

}

/* LINK */

function insertLink(){

restoreSelection();

const url=

prompt(

"Enter URL:"

);

if(!url)return;

$("editor").focus();

document.execCommand(

"createLink",

false,

url

);

update()

}

/* HIGHLIGHTER */

function toggleHighlighter(){

highlighter=

!highlighter;

$("highlightBtn")

.classList

.toggle(

"active",

highlighter

);

$("editor").style.cursor=

highlighter

?"text"

:"";

if(highlighter){

$("textColors")

.classList

.remove("show")

}

}

/* WORD UNDER TAP */

function wordRangeFromPoint(e){

let range=null;

if(

document.caretRangeFromPoint

){

range=

document.caretRangeFromPoint(

e.clientX,

e.clientY

)

}

else if(

document.caretPositionFromPoint

){

const p=

document.caretPositionFromPoint(

e.clientX,

e.clientY

);

if(p){

range=

document.createRange();

range.setStart(

p.offsetNode,

p.offset

);

range.collapse(true)

}

}

if(

!range||

range.startContainer.nodeType!==3

){

return null

}

const node=

range.startContainer;

const text=

node.textContent;

let start=

range.startOffset;

let end=

start;

while(

start>0&&

!/\s/.test(

text[start-1]

)

){

start--

}

while(

end<text.length&&

!/\s/.test(

text[end]

)

){

end++

}

if(start===end)return null;

const out=

document.createRange();

out.setStart(

node,

start

);

out.setEnd(

node,

end

);

return out

}

/* HIGHLIGHT CLICK */

$("editor")

.addEventListener(

"click",

e=>{

if(!highlighter)return;

const range=

wordRangeFromPoint(e);

if(!range)return;

const selection=

getSelection();

selection.removeAllRanges();

selection.addRange(range);

document.execCommand(

"hiliteColor",

false,

"#c9c35b"

);

document.execCommand(

"backColor",

false,

"#c9c35b"

);

selection.collapseToEnd();

update()

}

);

/* TEXT COLOUR */

function openTextColors(){

saveSelection();

const popup=

$("textColors");

const button=

$("textColorBtn");

const rect=

button.getBoundingClientRect();

popup.style.left=

Math.max(

8,

rect.left

)+"px";

popup.style.top=

(

rect.bottom+7

)+"px";

popup.classList.toggle(

"show"

)

}

function setTextColor(color){

restoreSelection();

$("editor").focus();

document.execCommand(

"foreColor",

false,

color

);

update();

$("textColors")

.classList

.remove(

"show"

)

}

/* PREVIEW */

function togglePreview(){

const p=

$("preview");

const e=

$("editor");

if(

p.style.display==="block"

){

p.style.display="none";

e.style.display="block";

$("previewBtn")

.classList

.remove("active");

}else{

p.innerHTML=

e.innerHTML;

p.style.display=

"block";

e.style.display=

"none";

$("previewBtn")

.classList

.add("active");

}

}

/* DRAWING */

function openDrawing(){

if(drawCanvas)return;

drawing=false;

setDrawTool("pen");

$("drawOverlay")

.style.display=

"block";

drawCanvas=

$("drawCanvas");

drawCanvas.width=

$("editorWrap").clientWidth;

drawCanvas.height=

$("editorWrap").clientHeight;

drawCtx=

drawCanvas.getContext("2d");

drawCtx.lineCap=

"round";

drawCtx.lineJoin=

"round";

undoStack=[];

redoStack=[];

const n=

currentNote();

if(

n&&

n.drawing

){

const image=

new Image();

image.onload=()=>{

drawCtx.drawImage(

image,

0,

0

)

};

image.src=

n.drawing

}

saveDrawState();

drawCanvas.addEventListener(

"pointerdown",

drawStart

);

drawCanvas.addEventListener(

"pointermove",

drawMove

);

window.addEventListener(

"pointerup",

drawEnd

);

$("drawBtn")

.classList

.add("active")

}

/* DRAW START */

function drawStart(e){

if(

drawTool==="ruler"

){

showRuler();

return

}

drawing=true;

drawCanvas

.setPointerCapture?.(

e.pointerId

);

const p=

point(e);

drawCtx.beginPath();

drawCtx.moveTo(

p.x,

p.y

)

}

/* DRAW MOVE */

function drawMove(e){

if(!drawing)return;

const p=

point(e);

drawCtx.globalCompositeOperation=

drawTool==="eraser"

?

"destination-out"

:

"source-over";

let size=

Number(

$("drawSize").value

);

if(

drawTool==="pencil"

){

size=

Math.max(

1,

size*.48

)

}

if(

drawTool==="marker"

){

size*=3

}

drawCtx.lineWidth=

size;

drawCtx.globalAlpha=

drawTool==="marker"

?

.28

:

1;

drawCtx.strokeStyle=

drawColor;

drawCtx.lineTo(

p.x,

p.y

);

drawCtx.stroke()

}

/* DRAW END */

function drawEnd(){

if(!drawing)return;

drawing=false;

drawCtx.globalAlpha=1;

drawCtx.globalCompositeOperation=

"source-over";

saveDrawState();

persistDrawing()

}

/* DRAW POSITION */

function point(e){

const rect=

drawCanvas

.getBoundingClientRect();

return{

x:e.clientX-rect.left,

y:e.clientY-rect.top

}

}

/* DRAW TOOL */

function setDrawTool(tool){

drawTool=tool;

document

.querySelectorAll(

"[data-draw]"

)

.forEach(

button=>

button.classList.toggle(

"active",

button.dataset.draw===tool

)

);

if(

tool==="ruler"

){

showRuler()

}else{

hideRuler()

}

}

/* DRAW COLOUR */

function setDrawColor(

color,

button

){

drawColor=color;

document

.querySelectorAll(

".drawColor"

)

.forEach(

b=>

b.classList.remove(

"selected"

)

);

button.classList.add(

"selected"

);

if(

drawTool==="eraser"

){

setDrawTool("pen")

}

/* DRAW HISTORY */

function saveDrawState(){

if(!drawCanvas)return;

undoStack.push(

drawCanvas.toDataURL()

);

if(

undoStack.length>35

){

undoStack.shift()

}

redoStack=[]

}

function restoreDraw(src){

const image=

new Image();

image.onload=()=>{

drawCtx.clearRect(

0,

0,

drawCanvas.width,

drawCanvas.height

);

drawCtx.drawImage(

image,

0,

0

);

persistDrawing()

};

image.src=src

}

function undoDraw(){

if(

undoStack.length<2

)return;

redoStack.push(

undoStack.pop()

);

restoreDraw(

undoStack[

undoStack.length-1

]

)

}

function redoDraw(){

if(!redoStack.length)return;

const state=

redoStack.pop();

undoStack.push(state);

restoreDraw(state)

}

function clearDraw(){

if(

!confirm(

"Clear the drawing?"

)

)return;

drawCtx.clearRect(

0,

0,

drawCanvas.width,

drawCanvas.height

);

saveDrawState();

persistDrawing()

}

function persistDrawing(){

const n=currentNote();

if(

n&&

drawCanvas

){

n.drawing=

drawCanvas.toDataURL();

save()

}

}

function closeDrawing(){

if(!drawCanvas)return;

persistDrawing();

$("drawOverlay")

.style.display=

"none";

$("drawBtn")

.classList

.remove("active");

drawCanvas=null;

drawCtx=null;

drawing=false;

hideRuler()

}

/* RULER */

function showRuler(){

$("ruler")

.classList

.add("show")

}

function hideRuler(){

$("ruler")

.classList

.remove("show")

}

let rulerDrag=false;

let rx=0;

let ry=0;

const ruler=

$("ruler");

ruler.addEventListener(

"pointerdown",

e=>{

rulerDrag=true;

rx=

e.clientX-

ruler.offsetLeft;

ry=

e.clientY-

ruler.offsetTop;

ruler

.setPointerCapture?.(

e.pointerId

)

}

);

ruler.addEventListener(

"pointermove",

e=>{

if(!rulerDrag)return;

ruler.style.left=

(

e.clientX-rx

)+"px";

ruler.style.top=

(

e.clientY-ry

)+"px"

}

);

ruler.addEventListener(

"pointerup",

()=>{

rulerDrag=false

}

);

/* SIDEBAR */

function toggleSidebar(){

$("sidebar")

.classList

.toggle("closed")

}

/* PIN */

function pinNote(){

const n=currentNote();

if(!n)return;

n.pin=!n.pin;

save();

render()

}

/* DUPLICATE */

function duplicateNote(){

const n=currentNote();

if(!n)return;

const copy={

...n,

id:Date.now(),

title:(n.title||"Untitled")+" copy"

};

data.notes.unshift(copy);

data.current=copy.id;

save();

render()

}

/* NEW NOTE */

function newNote(){

const n={

id:Date.now(),

title:"Untitled note",

html:"",

folder:

currentFolder==="__all__"||

currentFolder==="__private__"

?

null

:

currentFolder,

private:

currentFolder==="__private__",

pin:false,

drawing:null

};

data.notes.unshift(n);

data.current=n.id;

save();

render();

setTimeout(

()=>$("title").focus(),

30

)

}

/* DELETE */

function deleteNote(){

const n=currentNote();

if(

!n||

!confirm(

'Delete "'+

(n.title||"Untitled")+

'"?'

)

)return;

data.notes=

data.notes.filter(

x=>x.id!==n.id

);

if(!data.notes.length){

data.notes.push({

id:Date.now(),

title:"Untitled note",

html:"",

folder:null,

private:false,

pin:false,

drawing:null

})

}

data.current=

data.notes[0].id;

save();

render()

}

"keydown",

e=>{

const modifier=

e.metaKey||

e.ctrlKey;

e.key.toLowerCase()==="n"

){

e.preventDefault();

newNote()

}

modifier &&

e.key.toLowerCase()==="s"

){

){
