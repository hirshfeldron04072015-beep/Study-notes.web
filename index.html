 <!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#070707">

<title>StudyNotes</title>

<style>

:root{

--bg:#070707;

--surface:#0d0d0d;

--surface2:#141414;

--surface3:#1b1b1b;

--line:#262626;

--text:#f3f3f3;

--muted:#737373;

--soft:#aaa;

--highlight:#c9c35b;

--ease:cubic-bezier(.2,.8,.2,1)

}

*{box-sizing:border-box}

html,body{

margin:0;

width:100%;

height:100%;

background:var(--bg);

color:var(--text);

font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;

overflow:hidden

}

button,input,select{font:inherit}

button{border:0;cursor:pointer;color:inherit}

button:focus-visible,

input:focus-visible,

[contenteditable]:focus-visible{

outline:2px solid #686868;

outline-offset:2px

}

/* INTRO */

#intro{
position:fixed;
inset:0;
z-index:9999;
display:grid;
place-items:center;
background:#070707;
overflow:hidden;
animation:introAutoExit 1.15s var(--ease) 3.1s forwards
}

#intro:before,

#intro:after{

content:"";

position:absolute;

border:1px solid #252525;

border-radius:50%;

width:240px;

height:240px;

opacity:0;

animation:orbitGlow 2.4s var(--ease) .1s forwards

}

#intro:after{

width:420px;

height:420px;

animation-delay:.25s

}

.introCore{

position:relative;

z-index:2;

display:flex;

flex-direction:column;

align-items:center;

gap:18px;

animation:introCore 1.25s var(--ease) forwards

}

.introLogo{

width:132px;

height:132px;

filter:drop-shadow(0 0 28px #fff1)

}

.introName{

font-size:29px;

font-weight:650;

letter-spacing:-.8px

}

.introRule{

width:0;

height:1px;

background:#666;

animation:introRule 1s ease .55s forwards

}

#intro.exit{

animation:introExit 1.15s var(--ease) forwards

}

@keyframes introCore{

from{

opacity:0;

transform:scale(.72) translateY(18px);

filter:blur(9px)

}

to{

opacity:1;

transform:none;

filter:none

}

}

@keyframes introRule{

to{width:115px}

}

@keyframes orbitGlow{

from{

opacity:0;

transform:scale(.55)

}

60%{opacity:.7}

to{

opacity:0;

transform:scale(1.35)

}

}

@keyframes introAutoExit{
0%{opacity:1;transform:scale(1);visibility:visible}
100%{opacity:0;transform:scale(1.13);visibility:hidden;pointer-events:none}
}

@keyframes introExit{

0%{

opacity:1;

transform:scale(1)

}

35%{

opacity:1;

transform:scale(1.035)

}

100%{

opacity:0;

transform:scale(1.13);

visibility:hidden;

pointer-events:none

}

}

/* APP */

#app{

height:100%;

display:flex;

background:var(--bg)

}

/* SIDEBAR */

#sidebar{

width:300px;

min-width:300px;

background:linear-gradient(180deg,#101010,#0b0b0b);

border-right:1px solid var(--line);

display:flex;

flex-direction:column;

overflow:hidden;

transition:

width .38s var(--ease),

min-width .38s var(--ease),

transform .38s var(--ease),

opacity .25s

}

#sidebar.closed{

width:0;

min-width:0;

border-right:0;

opacity:.2

}

.sideTop{

padding:20px 17px 12px

}

.brand{

display:flex;

align-items:center;

gap:10px;

font-size:19px;

font-weight:650;

margin-bottom:19px

}

.brand svg{

width:27px;

height:27px;

flex:none

}

.searchWrap{

position:relative

}

.searchIcon{

position:absolute;

left:13px;

top:10px;

color:#686868;

pointer-events:none

}

.search{

width:100%;

height:42px;

border:1px solid #292929;

background:#151515;

color:#eee;

border-radius:12px;

padding:0 12px 0 36px;

outline:0;

transition:border-color .2s,box-shadow .2s

}

.search:focus{

border-color:#4b4b4b;

box-shadow:0 0 0 4px #fff08

}

.search::placeholder{

color:#5c5c5c

}

.sideTitle{

padding:15px 17px 7px;

color:#626262;

font-size:10px;

font-weight:700;

letter-spacing:1.2px;

text-transform:uppercase

}

.folders{

max-height:230px;

overflow:auto;

padding:0 8px

}

.notes{

flex:1;

overflow:auto;

padding:0 8px 10px

}

.folder,

.note{

display:flex;

align-items:center;

min-height:40px;

padding:0 10px;

border-radius:9px;

margin:2px 0;

color:#a9a9a9;

font-size:14px;

transition:

background .18s,

color .18s,

transform .18s

}

.folder:hover,

.note:hover{

background:#181818;

color:#eee;

transform:translateX(1px)

}

.folder.active,

.note.active{

background:#232323;

color:#fff

}

.dot{

width:7px;

height:7px;

border:1px solid #888;

border-radius:50%;

margin-right:9px;

flex:none

}

.folderName,

.noteName{

flex:1;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap

}

.folderDel{

opacity:0;

background:none;

color:#555;

padding:4px 5px

}

.folder:hover .folderDel{

opacity:1

}

.addFolder,

.sideButton{

width:100%;

background:none;

color:#777;

text-align:left;

padding:9px 10px;

border-radius:8px;

transition:

background .18s,

color .18s

}

.addFolder:hover,

.sideButton:hover{

background:#181818;

color:#eee

}

.sideBottom{

border-top:1px solid var(--line);

padding:8px

}

/* MAIN */

#main{

min-width:0;

flex:1;

height:100%;

display:flex;

flex-direction:column

}

.topbar{

height:58px;

min-height:58px;

border-bottom:1px solid var(--line);

display:flex;

align-items:center;

gap:3px;

padding:0 12px

}

.icon{

width:37px;

height:37px;

background:none;

border-radius:10px;

color:#999;

display:grid;

place-items:center;

transition:

background .18s,

color .18s,

transform .18s

}

.icon:hover{

background:#191919;

color:#fff;

transform:translateY(-1px)

}

.icon.active{

background:#252525;

color:#fff

}

.status{

margin-left:auto;

color:#5d5d5d;

font-size:11px;

padding-right:5px

}

/* TITLE */

.noteHeader{

display:flex;

align-items:center;

padding:34px 8% 15px

}

.title{

flex:1;

min-width:0;

border:0;

outline:0;

background:transparent;

color:#f4f4f4;

font-size:40px;

font-weight:680;

letter-spacing:-1.5px

}

.title::placeholder{

color:#4e4e4e

}

.pin{

color:#777;

margin-left:10px

}

/* TOOLBAR */

.toolbar{

margin:0 8%;

height:49px;

border-top:1px solid var(--line);

border-bottom:1px solid var(--line);

display:flex;

align-items:center;

gap:2px;

overflow-x:auto

}

.tool{

height:34px;

min-width:34px;

padding:0 9px;

background:none;

border-radius:8px;

color:#999;

display:grid;

place-items:center;

transition:

background .18s,

color .18s,

transform .18s

}

.tool:hover{

background:#191919;

color:#fff;

transform:translateY(-1px)

}

.tool.active{

background:#eee;

color:#111

}

.sep{

width:1px;

height:22px;

background:#292929;

margin:0 5px;

flex:none

}

/* EDITOR */

.editorWrap{

position:relative;

flex:1;

min-height:0;

overflow:auto;

padding:28px 8% 75px

}

.editor{

min-height:520px;

outline:0;

color:#e8e8e8;

font-size:17px;

line-height:1.76;

caret-color:#fff;

transition:opacity .2s

}

.editor:empty:before{

content:"Start writing here...";

color:#4d4d4d

}

.editor h1{

font-size:33px;

line-height:1.18

}

.editor h2{

font-size:25px;

line-height:1.25

}

.editor h3{

font-size:20px

}

.editor pre{

background:#121212;

border:1px solid #292929;

border-radius:11px;

padding:15px;

white-space:pre-wrap

}

.editor blockquote{

border-left:3px solid #626262;

padding-left:15px;

color:#aaa

}

.editor a{

color:#eee

}

.editor mark{

background:var(--highlight);

color:#111;

padding:0 2px;

border-radius:3px

}

.editor table{

border-collapse:collapse;

width:100%

}

.editor td{

border:1px solid #333;

padding:12px;

vertical-align:top

}

.stats{

height:34px;

min-height:34px;

border-top:1px solid var(--line);

display:flex;

align-items:center;

padding:0 8%;

font-size:11px;

color:#606060

}

/* TEXT COLOUR */

.pop{

position:fixed;

z-index:500;

display:none;

background:rgba(23,23,23,.96);

border:1px solid #3a3a3a;

border-radius:14px;

padding:9px;

box-shadow:0 20px 60px #000b;

backdrop-filter:blur(20px);

gap:7px;

flex-wrap:wrap;

animation:popIn .18s var(--ease)

}

.pop.show{

display:flex

}

@keyframes popIn{

from{

opacity:0;

transform:translateY(-5px) scale(.96)

}

to{

opacity:1;

transform:none

}

}

.swatch{

width:28px;

height:28px;

border-radius:50%;

border:2px solid #555

}

.sblack{background:#050505}

.swhite{background:#fff}

.sred{background:#ff453a}

.sorange{background:#ff9f0a}

.syellow{background:#ffd60a}

.sgreen{background:#30d158}

.sblue{background:#0a84ff}

.spurple{background:#bf5af2}

.spink{background:#ff375f}

/* DRAWING */

#drawOverlay{

position:absolute;

inset:0;

z-index:200;

display:none;

background:rgba(7,7,7,.08);

backdrop-filter:blur(1px)

}

.drawCanvas{

position:absolute;

inset:0;

width:100%;

height:100%;

touch-action:none

}

.drawTop{

position:absolute;

top:14px;

left:50%;

transform:translateX(-50%);

display:flex;

align-items:center;

gap:5px;

padding:7px;

background:rgba(26,26,26,.92);

border:1px solid #393939;

border-radius:14px;

box-shadow:0 15px 45px #0009;

backdrop-filter:blur(22px);

max-width:94%;

overflow:auto

}

.drawBottom{

position:absolute;

bottom:17px;

left:50%;

transform:translateX(-50%);

display:flex;

align-items:center;

gap:5px;

padding:7px;

background:rgba(26,26,26,.92);

border:1px solid #393939;

border-radius:15px;

box-shadow:0 18px 55px #0009;

backdrop-filter:blur(22px);

max-width:96%;

overflow:auto

}

.drawTool{

height:36px;

padding:0 11px;

border-radius:9px;

background:#232323;

color:#aaa;

font-size:12px;

white-space:nowrap;

transition:.18s

}

.drawTool:hover{

background:#333;

color:#fff

}

.drawTool.active{

background:#f0f0f0;

color:#111

}

.drawColor{

width:25px;

height:25px;

border-radius:50%;

border:2px solid #555;

flex:none

}

.drawColor.selected{

border-color:#fff;

box-shadow:0 0 0 2px #111 inset

}

.cBlack{background:#050505}

.cWhite{background:#fff}

.cRed{background:#ff453a}

.cOrange{background:#ff9f0a}

.cYellow{background:#ffd60a}

.cGreen{background:#30d158}

.cBlue{background:#0a84ff}

.cPurple{background:#bf5af2}

.cPink{background:#ff375f}

.size{

height:36px;

background:#232323;

color:#bbb;

border:0;

border-radius:9px;

padding:0 8px

}

#ruler{

position:absolute;

display:none;

z-index:210;

width:330px;

height:38px;

background:rgba(35,35,35,.95);

border:1px solid #555;

border-radius:7px;

box-shadow:0 15px 40px #0009;

cursor:grab;

touch-action:none

}

#ruler.show{

display:block

}

.rulerTicks{

position:absolute;

left:12px;

right:12px;

top:5px;

height:26px;

background:

repeating-linear-gradient(

90deg,

#aaa 0,

#aaa 1px,

transparent 1px,

transparent 10px

);

opacity:.65

}

.rulerCenter{

position:absolute;

left:50%;

top:0;

height:100%;

width:1px;

background:#fff

}

/* MODAL */

#modal{

position:fixed;

inset:0;

z-index:800;

display:none;

place-items:center;

background:#0008;

backdrop-filter:blur(10px);

padding:20px

}

#modal.show{

display:grid;

animation:modalIn .22s var(--ease)

}

@keyframes modalIn{

from{opacity:0}

to{opacity:1}

}

.modalBox{

width:min(720px,94vw);

max-height:86vh;

overflow:auto;

background:#111;

border:1px solid #303030;

border-radius:18px;

box-shadow:0 30px 90px #000c;

animation:modalBoxIn .25s var(--ease)

}

@keyframes modalBoxIn{

from{

opacity:0;

transform:translateY(14px) scale(.97)

}

to{

opacity:1;

transform:none

}

}

.modalHead{

height:58px;

display:flex;

align-items:center;

padding:0 17px;

border-bottom:1px solid #292929

}

.modalTitle{

font-size:17px;

font-weight:650;

flex:1

}

.modalClose{

width:34px;

height:34px;

border-radius:9px;

background:none;

color:#777;

font-size:20px

}

.modalClose:hover{

background:#202020;

color:#fff

}

.modalBody{

padding:18px

}

.helpText{

color:#aaa;

line-height:1.65

}

.helpText p{

margin:0 0 14px

}

/* TEMPLATES */

.templateGrid{

display:grid;

grid-template-columns:repeat(2,minmax(0,1fr));

gap:12px

}

.templateCard{

background:#171717;

border:1px solid #292929;

border-radius:14px;

padding:12px;

text-align:left;

transition:.22s var(--ease)

}

.templateCard:hover{

background:#202020;

border-color:#444;

transform:translateY(-2px)

}

.templatePreview{

height:120px;

border:1px solid #303030;

background:#0c0c0c;

border-radius:9px;

margin-bottom:11px;

padding:10px;

display:grid;

gap:7px

}

.templatePreview span{

display:block;

height:8px;

background:#454545;

border-radius:4px

}

.templatePreview span:nth-child(2){

width:72%

}

.templatePreview span:nth-child(3){

width:90%

}

.templatePreview span:nth-child(4){

width:55%

}

.shapeCornell{

grid-template-columns:30% 1fr

}

.shapeCornell span:nth-child(3){

grid-column:1/3

}

.shapeCornell span:nth-child(4){

grid-column:1/3

}

.shapeExam{

grid-template-columns:1fr 1fr

}

.shapeExam span:nth-child(3){

width:100%

}

.shapeExam span:nth-child(4){

width:100%

}

.shapeEssay{

grid-template-columns:1fr

}

.shapeEssay span:nth-child(2){

width:60%

}

.shapeEssay span:nth-child(3){

width:85%

}

.shapeProject{

grid-template-columns:repeat(3,1fr)

}

.shapeProject span{

width:100%!important

}

.shapeFlash{

grid-template-columns:1fr 1fr

}

.shapeFlash span{

width:100%!important

}

.templateName{

font-weight:650;

font-size:14px;

margin-bottom:4px

}

.templateDesc{

font-size:11px;

color:#777;

line-height:1.45

}

/* SETTINGS */

.settingRow{

padding:13px 0;

border-bottom:1px solid #292929;

color:#aaa;

display:flex;

align-items:center;

gap:12px

}

.settingRow:last-child{

border-bottom:0

}

.settingRow button{

margin-left:auto;

background:#242424;

border-radius:9px;

padding:8px 11px;

color:#ddd

}

.settingRow button:hover{

background:#333

}

/* RESPONSIVE */

@media(max-width:800px){

#sidebar{

width:270px;

min-width:270px

}

.noteHeader{

padding-left:5%;

padding-right:5%

}

.toolbar{

margin-left:5%;

margin-right:5%

}

.editorWrap{

padding-left:5%;

padding-right:5%

}

.stats{

padding-left:5%;

padding-right:5%

}

.title{

font-size:34px

}

}

@media(max-width:600px){

#sidebar{

position:absolute;

z-index:300;

height:100%;

box-shadow:20px 0 50px #0008

}

#sidebar.closed{

transform:translateX(-100%);

width:270px;

min-width:270px;

opacity:1

}

.templateGrid{

grid-template-columns:1fr

}

.title{

font-size:29px

}

.editor{

font-size:16px

}

}

/* MARKDOWN PREVIEW */

#preview{

display:none;

flex:1;

min-height:0;

overflow:auto;

padding:28px 8% 75px;

color:#e8e8e8;

font-size:17px;

line-height:1.76

}

#preview h1{

font-size:33px

}

#preview h2{

font-size:25px

}

#preview h3{

font-size:20px

}

#preview pre{

background:#121212;

border:1px solid #292929;

border-radius:11px;

padding:15px;

white-space:pre-wrap

}

#preview blockquote{

border-left:3px solid #626262;

padding-left:15px;

color:#aaa

}

/* MARKDOWN */

.markdownArea{

display:none;

width:100%;

height:100%;

resize:none;

border:0;

outline:0;

background:transparent;

color:#e8e8e8;

font-family:ui-monospace,SFMono-Regular,Menlo,monospace;

font-size:16px;

line-height:1.7

}

</style>

</head>

<body>

<div id="intro">

<div class="introCore">

<svg class="introLogo" viewBox="0 0 120 120">

<ellipse
cx="60"
cy="60"
rx="49"
ry="20"
fill="none"
stroke="#707070"
stroke-width="1.4"
transform="rotate(45 60 60)"
/>

<circle cx="60" cy="60" r="16" fill="#202020"/>

<circle cx="60" cy="60" r="10" fill="#f4f4f4"/>

</svg>

<div class="introName">StudyNotes</div>

<div class="introRule"></div>

</div>

</div>

<div id="app">

<aside id="sidebar">

<div class="sideTop">

<div class="brand">

<svg viewBox="0 0 60 60">

<ellipse
cx="30"
cy="30"
rx="24"
ry="10"
fill="none"
stroke="#777"
stroke-width="1.2"
/>

<ellipse
cx="30"
cy="30"
rx="24"
ry="10"
fill="none"
stroke="#777"
stroke-width="1.2"
transform="rotate(60 30 30)"
/>

<ellipse
cx="30"
cy="30"
rx="24"
ry="10"
fill="none"
stroke="#777"
stroke-width="1.2"
transform="rotate(120 30 30)"
/>

<circle cx="30" cy="30" r="7" fill="#eee"/>

</svg>

<span>StudyNotes</span>

</div>

<div class="searchWrap">

<div class="searchIcon">⌕</div>

<input
id="search"
class="search"
placeholder="Search notes..."
autocomplete="off"
/>

</div>

</div>

<div class="sideTitle">Folders</div>

<div id="folders" class="folders"></div>

<button class="addFolder" onclick="addFolder()">＋ New folder</button>

<div class="sideTitle">Notes</div>

<div id="notes" class="notes"></div>

<div class="sideBottom">

<button class="sideButton" onclick="newNote()">＋ New note</button>

<button class="sideButton" onclick="templates()">▦ Templates</button>

<button class="sideButton" onclick="settings()">⚙ Settings</button>

<button class="sideButton" onclick="help()">? Help</button>

</div>

</aside>

<main id="main">

<div class="topbar">

<button class="icon" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>

<button class="icon" onclick="newNote()" title="New note">＋</button>

<button class="icon" onclick="duplicateNote()" title="Duplicate">⧉</button>

<button class="icon" id="previewBtn" onclick="togglePreview()" title="Preview">◫</button>

<button class="icon" id="drawBtn" onclick="openDrawing()" title="Drawing">✎</button>

<div class="status" id="status">Saved</div>

</div>

<div class="noteHeader">

<input
id="title"
class="title"
placeholder="Untitled"
autocomplete="off"
/>

<button
id="pinBtn"
class="icon pin"
onclick="togglePin()"
title="Pin note"
>☆</button>

</div>

<div class="toolbar">

<button class="tool" onclick="format('bold')" title="Bold"><b>B</b></button>

<button class="tool" onclick="format('italic')" title="Italic"><i>I</i></button>

<button class="tool" onclick="format('underline')" title="Underline"><u>U</u></button>

<button class="tool" onclick="formatBlock('h2')" title="Heading">H2</button>

<button class="tool" onclick="formatBlock('blockquote')" title="Quote">❝</button>

<button class="tool" onclick="formatBlock('pre')" title="Code">{"}"}</button>

<button class="tool" onclick="insertChecklist()" title="Checklist">☑</button>

<button class="tool" onclick="insertLink()" title="Link">↗</button>

<div class="sep"></div>

<button class="tool" id="highlightBtn" onclick="toggleHighlighter()" title="Highlighter">▰</button>

<button class="tool" onclick="toggleTextColors()" title="Text colour">A</button>

<div class="sep"></div>

<button class="tool" onclick="clearFormatting()" title="Clear formatting">Tx</button>

<button class="tool" onclick="saveNow()" title="Save">✓</button>

</div>

<div id="editorWrap" class="editorWrap">

<div
id="editor"
class="editor"
contenteditable="true"
spellcheck="true"
></div>

<script>

const KEY="studynotes_ultra_v2";

let data={
folders:[],
notes:[],
activeFolder:null,
activeNote:null
};

let highlighter=false;

let drawCanvas=null;

let drawCtx=null;

let drawing=false;

let drawTool="pen";

let drawColor="#050505";

let undoStack=[];

let redoStack=[];

function $(id){

return document.getElementById(id)

}

/* STORAGE */

function save(){

localStorage.setItem(KEY,JSON.stringify(data));

$("status").textContent="Saved";

setTimeout(()=>{

$("status").textContent="";

},1200)

}

function load(){

try{

const saved=localStorage.getItem(KEY);

if(saved){

data=JSON.parse(saved)

}

}catch(e){

data={folders:[],notes:[],activeFolder:null,activeNote:null}

}

if(!data.folders)

data.folders=[];

if(!data.notes)

data.notes=[];

if(!data.notes.length){

const id=Date.now();

data.notes.push({

id,

title:"Welcome to StudyNotes",

html:

"<h1>Welcome</h1><p>This is your writing space.</p><p>Create notes, organise them into folders, use templates, highlight words, format text or open the drawing tools.</p>",

folder:null,

pinned:false,

created:Date.now(),

updated:Date.now(),

drawing:null

});

data.activeNote=id

}

if(!data.activeNote)

data.activeNote=data.notes[0].id;

render();

setTimeout(()=>{

$("intro").classList.add("exit")

},3000)

}

/* CURRENT NOTE */

function currentNote(){

return data.notes.find(n=>n.id===data.activeNote)

}

/* RENDER */

function render(){

renderFolders();

renderNotes();

renderEditor()

}

/* FOLDERS */

function renderFolders(){

const wrap=$("folders");

wrap.innerHTML="";

const all=document.createElement("button");

all.className="folder "+(!data.activeFolder?"active":"");

all.innerHTML='<span class="dot"></span><span class="folderName">All notes</span>';

all.onclick=()=>{

data.activeFolder=null;

render()

};

wrap.appendChild(all);

data.folders.forEach(folder=>{

const b=document.createElement("button");

b.className="folder "+(data.activeFolder===folder.id?"active":"");

b.innerHTML=

'<span class="dot"></span>'+

'<span class="folderName">'+escapeHTML(folder.name)+'</span>'+

'<span class="folderDel">×</span>';

b.onclick=(e)=>{

if(e.target.classList.contains("folderDel")){

deleteFolder(folder.id);

return

}

data.activeFolder=folder.id;

render()

};

wrap.appendChild(b)

})

}

/* NOTES */

function renderNotes(){

const wrap=$("notes");

wrap.innerHTML="";

const query=$("search").value.trim().toLowerCase();

let notes=[...data.notes];

if(data.activeFolder)

notes=notes.filter(n=>n.folder===data.activeFolder);

if(query)

notes=notes.filter(n=>

(n.title||"").toLowerCase().includes(query)||

stripHTML(n.html||"").toLowerCase().includes(query)

);

notes.sort((a,b)=>{

if(a.pinned!==b.pinned)

return a.pinned?-1:1;

return b.updated-a.updated

});

notes.forEach(n=>{

const b=document.createElement("button");

b.className="note "+(n.id===data.activeNote?"active":"");

b.innerHTML=

'<span class="noteName">'+

(n.pinned?"★ ":"")+

escapeHTML(n.title||"Untitled")+

'</span>';

b.onclick=()=>{

data.activeNote=n.id;

renderEditor()

renderNotes()

};

wrap.appendChild(b)

})

}

/* EDITOR */

function renderEditor(){

const n=currentNote();

if(!n)

return;

$("title").value=n.title||"Untitled";

$("editor").innerHTML=n.html||"";

$("markdownArea").value=htmlToMarkdown(n.html||"");

$("editor").style.display="block";

$("markdownArea").style.display="none";

$("preview").style.display="none";

$("previewBtn").classList.remove("active");

$("pinBtn").textContent=n.pinned?"★":"☆";

updateStats()

}

/* UPDATE */

function update(){

const n=currentNote();

if(!n)

return;

n.title=$("title").value.trim()||"Untitled";

n.html=$("editor").innerHTML;

n.updated=Date.now();

save();

renderNotes();

updateStats()

}

function saveNow(){

update()

}

/* NEW NOTE */

function newNote(){

const id=Date.now();

const folder=data.activeFolder||null;

data.notes.unshift({

id,

title:"Untitled",

html:"",

folder,

pinned:false,

created:Date.now(),

updated:Date.now(),

drawing:null

});

data.activeNote=id;

save();

render()

setTimeout(()=>{

$("title").focus()

},50)

}

/* DELETE NOTE */

function deleteNote(){

const n=currentNote();

if(!n)

return;

if(!confirm("Delete this note?"))

return;

data.notes=data.notes.filter(x=>x.id!==n.id);

if(!data.notes.length){

newNote();

return

}

data.activeNote=data.notes[0].id;

save();

render()

}

/* DUPLICATE */

function duplicateNote(){

const n=currentNote();

if(!n)

return;

const copy={

...n,

id:Date.now(),

title:(n.title||"Untitled")+" copy",

created:Date.now(),

updated:Date.now()

};

data.notes.unshift(copy);

data.activeNote=copy.id;

save();

render()

}

/* PIN */

function togglePin(){

const n=currentNote();

if(!n)

return;

n.pinned=!n.pinned;

n.updated=Date.now();

save();

renderNotes();

$("pinBtn").textContent=n.pinned?"★":"☆"

}

/* FOLDERS */

function addFolder(){

const name=prompt("Folder name:");

if(!name||!name.trim())

return;

const folder={

id:Date.now(),

name:name.trim()

};

data.folders.push(folder);

data.activeFolder=folder.id;

save();

render()

}

function deleteFolder(id){

const folder=data.folders.find(f=>f.id===id);

if(!folder)

return;

if(!confirm('Delete folder "'+folder.name+'"? Notes will stay.'))

return;

data.notes.forEach(n=>{

if(n.folder===id)

n.folder=null

});

data.folders=data.folders.filter(f=>f.id!==id);

data.activeFolder=null;

save();

render()

}

/* FORMATTING */

function format(command){

document.execCommand(command,false,null);

update()

}

function formatBlock(tag){

document.execCommand("formatBlock",false,tag);

update()

}

function insertChecklist(){

document.execCommand("insertText",false,"☐ ");

update()

}

function insertLink(){

const url=prompt("Enter link:");

if(!url)

return;

document.execCommand("createLink",false,url);

update()

}

function clearFormatting(){

document.execCommand("removeFormat",false,null);

update()

}

/* HIGHLIGHTER */

function toggleHighlighter(){

highlighter=!highlighter;

$("highlightBtn").classList.toggle("active",highlighter)

}

function applyHighlightToWord(){

const sel=window.getSelection();

if(!sel||!sel.rangeCount)

return;

const range=sel.getRangeAt(0);

if(range.collapsed)

return;

const mark=document.createElement("mark");

try{

range.surroundContents(mark)

}catch(e){

const text=range.toString();

if(text){

document.execCommand("backColor",false,"#c9c35b")

}

}

update()

}

$("editor").addEventListener("click",e=>{

if(!highlighter)

return;

if(e.target.closest("a"))

return;

const sel=window.getSelection();

if(sel&&sel.toString().trim()){

applyHighlightToWord();

return

}

const textNode=e.target.nodeType===3?e.target:e.target.firstChild;

if(!textNode||textNode.nodeType!==3)

return;

const text=textNode.textContent;

let pos=0;

let x=e.clientX;

const range=document.createRange();

for(let i=0;i<text.length;i++){

range.setStart(textNode,i);

range.setEnd(textNode,i+1);

const r=range.getBoundingClientRect();

if(x>=r.left&&x<=r.right){

let start=i;

let end=i;

while(start>0&&!/\s/.test(text[start-1]))

start--;

while(end<text.length&&!/\s/.test(text[end]))

end++;

range.setStart(textNode,start);

range.setEnd(textNode,end);

const mark=document.createElement("mark");

try{

range.surroundContents(mark)

}catch(err){

return

}

update();

return

}

}

});

/* TEXT COLOURS */

function toggleTextColors(){

$("textColors").classList.toggle("show")

}

function setTextColor(color){

document.execCommand("foreColor",false,color);

$("textColors").classList.remove("show");

update()

}

/* PREVIEW */

function togglePreview(){

const e=$("editor");

const p=$("preview");

if(p.style.display==="block"){

p.style.display="none";

e.style.display="block";

$("previewBtn").classList.remove("active")

}else{

p.innerHTML=e.innerHTML;

p.style.display="block";

e.style.display="none";

$("previewBtn").classList.add("active")

}

}

/* SIDEBAR */

function toggleSidebar(){

$("sidebar").classList.toggle("closed")

}

/* STATS */

function updateStats(){

const text=stripHTML($("editor").innerHTML||"").trim();

const words=text?text.split(/\s+/).length:0;

const chars=text.length;

const minutes=words?Math.max(1,Math.ceil(words/200)):0;

$("wordCount").textContent=words+" words";

$("charCount").textContent=chars+" characters";

$("readingTime").textContent=minutes+" min read"

}

/* EDITOR INPUT */

$("editor").addEventListener("input",()=>{

const n=currentNote();

if(!n)

return;

n.html=$("editor").innerHTML;

n.updated=Date.now();

updateStats();

$("status").textContent="Editing…"

});

$("title").addEventListener("input",()=>{

const n=currentNote();

if(!n)

return;

n.title=$("title").value;

n.updated=Date.now();

renderNotes();

$("status").textContent="Editing…"

});

$("editor").addEventListener("blur",update);

$("title").addEventListener("blur",update);

/* DRAWING */

function openDrawing(){

if(drawCanvas)

return;

$("drawOverlay").style.display="block";

drawCanvas=$("drawCanvas");

drawCanvas.width=$("editorWrap").clientWidth;

drawCanvas.height=$("editorWrap").clientHeight;

drawCtx=drawCanvas.getContext("2d");

drawCtx.lineCap="round";

drawCtx.lineJoin="round";

undoStack=[];

redoStack=[];

const n=currentNote();

if(n&&n.drawing){

const image=new Image();

image.onload=()=>{

drawCtx.drawImage(image,0,0)

};

image.src=n.drawing

}

saveDrawState();

drawCanvas.addEventListener("pointerdown",drawStart);

drawCanvas.addEventListener("pointermove",drawMove);

window.addEventListener("pointerup",drawEnd);

$("drawBtn").classList.add("active")

}

/* DRAW START */

function drawStart(e){

if(drawTool==="ruler"){

showRuler();

return

}

drawing=true;

drawCanvas.setPointerCapture?.(e.pointerId);

const p=point(e);

drawCtx.beginPath();

drawCtx.moveTo(p.x,p.y)

}

/* DRAW MOVE */

function drawMove(e){

if(!drawing)

return;

const p=point(e);

drawCtx.globalCompositeOperation=

drawTool==="eraser"

?"destination-out"

:"source-over";

let size=Number($("drawSize").value);

if(drawTool==="pencil"){

size=Math.max(1,size*.48)

}

if(drawTool==="marker"){

size*=3

}

drawCtx.lineWidth=size;

drawCtx.globalAlpha=

drawTool==="marker"

?.28

:1;

drawCtx.strokeStyle=drawColor;

drawCtx.lineTo(p.x,p.y);

drawCtx.stroke()

}

/* DRAW END */

function drawEnd(){

if(!drawing)

return;

drawing=false;

drawCtx.globalAlpha=1;

drawCtx.globalCompositeOperation="source-over";

saveDrawState();

persistDrawing()

}

/* DRAW POSITION */

function point(e){

const rect=drawCanvas.getBoundingClientRect();

return{

x:e.clientX-rect.left,

y:e.clientY-rect.top

}

}

/* DRAW TOOL */

function setDrawTool(tool){

drawTool=tool;

document

.querySelectorAll("[data-draw]")

.forEach(button=>

button.classList.toggle(

"active",

button.dataset.draw===tool

)

);

if(tool==="ruler"){

showRuler()

}else{

hideRuler()

}

}

/* DRAW COLOUR */

function setDrawColor(color,button){

drawColor=color;

document

.querySelectorAll(".drawColor")

.forEach(b=>

b.classList.remove("selected")

);

button.classList.add("selected");

if(drawTool==="eraser"){

setDrawTool("pen")

}

}

/* DRAW HISTORY */

function saveDrawState(){

if(!drawCanvas)

return;

undoStack.push(drawCanvas.toDataURL());

if(undoStack.length>35){

undoStack.shift()

}

redoStack=[]

}

function restoreDraw(src){

const image=new Image();

image.onload=()=>{

drawCtx.clearRect(

0,

0,

drawCanvas.width,

drawCanvas.height

);

drawCtx.drawImage(

image,

0,

0

);

persistDrawing()

};

image.src=src

}

function undoDraw(){

if(undoStack.length<2)

return;

redoStack.push(undoStack.pop());

restoreDraw(

undoStack[

undoStack.length-1

]

)

}

function redoDraw(){

if(!redoStack.length)

return;

const state=redoStack.pop();

undoStack.push(state);

restoreDraw(state)

}

function clearDraw(){

if(!confirm("Clear the drawing?"))

return;

drawCtx.clearRect(

0,

0,

drawCanvas.width,

drawCanvas.height

);

saveDrawState();

persistDrawing()

}

function persistDrawing(){

const n=currentNote();

if(n&&drawCanvas){

n.drawing=drawCanvas.toDataURL();

save()

}

}

function closeDrawing(){

persistDrawing();

$("drawOverlay").style.display="none";

$("drawBtn").classList.remove("active");

drawCanvas=null;

drawCtx=null;

hideRuler()

}

/* RULER */

function showRuler(){

$("ruler").classList.add("show")

}

function hideRuler(){

$("ruler").classList.remove("show")

}

let rulerDrag=false;

let rx=0;

let ry=0;

const ruler=$("ruler");

ruler.addEventListener("pointerdown",e=>{

rulerDrag=true;

rx=e.clientX-ruler.offsetLeft;

ry=e.clientY-ruler.offsetTop;

ruler.setPointerCapture?.(e.pointerId)

});

ruler.addEventListener("pointermove",e=>{

if(!rulerDrag)

return;

ruler.style.left=(e.clientX-rx)+"px";

ruler.style.top=(e.clientY-ry)+"px"

});

ruler.addEventListener("pointerup",()=>{

rulerDrag=false

});

/* TEMPLATES */

const templatesData={

desc:"A calm daily page for goals, notes and review.",

shape:"shapeDaily",

html:"<h1>Today</h1><h2>Focus</h2><p>What matters most today?</p><h2>Notes</h2><p></p><h2>Key takeaway</h2><p></p><h2>Tomorrow</h2><p>What should I remember?</p>"

},

"Cornell Notes":{

},

"Exam Revision":{

},

"Essay Planner":{

},

},

}

};

/* TEMPLATE WINDOW */

function templates(){

let html='<div class="templateGrid">';

Object.entries(templatesData).forEach(([name,t])=>{

html+=

'<button class="templateCard" onclick="useTemplate('+JSON.stringify(name)+')">'+

'<div class="templatePreview '+t.shape+'">'+

'<span></span>'+

'<span></span>'+

'<span></span>'+

'<span></span>'+

'</div>'+

'<div class="templateName">'+

name+

'</div>'+

'<div class="templateDesc">'+

t.desc+

'</div>'+

'</button>'

});

html+='</div>';

openModal("Templates",html)

}

/* USE TEMPLATE */

function useTemplate(name){

const n=currentNote();

if(!n)

return;

n.title=name;

n.html=templatesData[name].html;

save();

closeModal();

render()

}

/* SETTINGS */

function settings(){

openModal(

"Settings",

'<div class="settingRow">Private folder code.<button onclick="changePrivateCode()">Change code</button></div>'+

'<div class="settingRow">'+

'Your notes are saved locally in this browser.'+

'<button onclick="exportData()">Export backup</button>'+

'</div>'+

'<div class="settingRow">'+

'Reset your local StudyNotes data.'+

'<button onclick="resetData()">Reset all</button>'+

'</div>'

)

}

function changePrivateCode(){

const old=privateCode();

if(!old)

return openPrivateFolder();

const cur=prompt("Current private code:");

if(cur===null)

return;

if(codeHash(cur.trim())!==old)

return alert("Wrong current code.");

const next=prompt("New private code:");

if(next===null||!next.trim())

return;

localStorage.setItem(

KEY+"_private_code",

codeHash(next.trim())

);

alert("Private code changed.")

}

/* EXPORT */

function exportData(){

const blob=new Blob(

[JSON.stringify(data,null,2)],

{

type:"application/json"

}

);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="StudyNotes-backup.json";

a.click();

setTimeout(()=>URL.revokeObjectURL(a.href),1000)

}

/* RESET */

function resetData(){

if(confirm("Delete all notes and folders?")){

localStorage.removeItem(KEY);

location.reload()

}

}

openModal(

"StudyNotes",

'<div class="helpText">'+

'<p><b>☰</b> hides the left panel so the writing area becomes full width.</p>'+

'<p><b>Drawing:</b> use Pen, Pencil, Marker, Ruler and Eraser. Choose a colour and thickness.</p>'+

'<p><b>Templates:</b> choose a complete study layout and start filling it in.</p>'+

'<p><b>⌘/Ctrl + N</b> new note · <b>⌘/Ctrl + S</b> save · <b>⌘/Ctrl + F</b> search.</p>'+

'</div>'

)

}

/* MODAL */

function openModal(title,body){

$("modalTitle").textContent=title;

$("modalBody").innerHTML=body;

$("modal").classList.add("show")

}

function closeModal(){

$("modal").classList.remove("show")

}

/* SEARCH */

$("search").addEventListener("input",renderNotes);

/* KEYBOARD */

document.addEventListener("keydown",e=>{

const modifier=e.metaKey||e.ctrlKey;

if(modifier&&e.key.toLowerCase()==="n"){

e.preventDefault();

newNote()

}

if(modifier&&e.key.toLowerCase()==="s"){

e.preventDefault();

update()

}

if(modifier&&e.key.toLowerCase()==="f"){

e.preventDefault();

}

/* HELPERS */

function stripHTML(html){

const div=document.createElement("div");

div.innerHTML=html;

return div.textContent||div.innerText||""

}

function escapeHTML(str){

return String(str)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;")

}

function htmlToMarkdown(html){

const div=document.createElement("div");

div.innerHTML=html;

return div.innerText||""

}

function codeHash(str){

let h=0;

for(let i=0;i<str.length;i++){

h=((h<<5)-h)+str.charCodeAt(i);

h|=0

}

return String(h)

}

function privateCode(){

return localStorage.getItem(KEY+"_private_code")

}

function openPrivateFolder(){

const code=prompt("Create a private folder code:");

if(code===null||!code.trim())

return;

localStorage.setItem(

KEY+"_private_code",

codeHash(code.trim())

);

alert("Private folder code created.")

}
