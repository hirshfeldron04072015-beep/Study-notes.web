<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>StudyNotes</title>
<style>
:root{
--bg:#070707;
--surface:#0d0d0d;
--surface2:#141414;
--surface3:#1b1b1b;
--line:#262626;
--text:#f3f3f3;
--muted:#737373;
--soft:#aaa;
--highlight:#c9c35b;
--ease:cubic-bezier(.2,.8,.2,1)
}
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
overflow:hidden
}
button,input,select{font:inherit}
button{border:0;cursor:pointer;color:inherit}
button:focus-visible,
input:focus-visible,
[contenteditable]:focus-visible{
outline:2px solid #686868;
outline-offset:2px
}

/* INTRO */
#intro{
position:fixed;
inset:0;
z-index:9999;
display:grid;
place-items:center;
background:#070707;
overflow:hidden;
animation:introAutoExit 1.15s var(--ease) 3.1s forwards
}
#intro:before,
#intro:after{
content:"";
position:absolute;
border:1px solid #252525;
border-radius:50%;
width:240px;
height:240px;
opacity:0;
animation:orbitGlow 2.4s var(--ease) .1s forwards
}
#intro:after{
width:420px;
height:420px;
animation-delay:.25s
}
.introCore{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
animation:introCore 1.25s var(--ease) forwards
}
.introLogo{
width:132px;
height:132px;
filter:drop-shadow(0 0 28px #fff1)
}
.introName{
font-size:29px;
font-weight:650;
letter-spacing:-.8px
}
.introRule{
width:0;
height:1px;
background:#666;
animation:introRule 1s ease .55s forwards
}
#intro.exit{
animation:introExit 1.15s var(--ease) forwards
}
@keyframes introCore{
from{
opacity:0;
transform:scale(.72) translateY(18px);
filter:blur(9px)
}
to{
opacity:1;
transform:none;
filter:none
}
}
@keyframes introRule{
to{width:115px}
}
@keyframes orbitGlow{
from{
opacity:0;
transform:scale(.55)
}
60%{opacity:.7}
to{
opacity:0;
transform:scale(1.35)
}
}
@keyframes introAutoExit{
0%{opacity:1;transform:scale(1);visibility:visible}
100%{opacity:0;transform:scale(1.13);visibility:hidden;pointer-events:none}
}
@keyframes introExit{
0%{
opacity:1;
transform:scale(1)
}
35%{
opacity:1;
transform:scale(1.035)
}
100%{
opacity:0;
transform:scale(1.13);
visibility:hidden;
pointer-events:none
}
}

/* APP */
#app{
height:100%;
display:flex;
background:var(--bg)
}

/* SIDEBAR */
#sidebar{
width:300px;
min-width:300px;
background:linear-gradient(180deg,#101010,#0b0b0b);
border-right:1px solid var(--line);
display:flex;
flex-direction:column;
overflow:hidden;
transition:
width .38s var(--ease),
min-width .38s var(--ease),
transform .38s var(--ease),
opacity .25s
}
#sidebar.closed{
width:0;
min-width:0;
border-right:0;
opacity:.2
}
.sideTop{
padding:20px 17px 12px
}
.brand{
display:flex;
align-items:center;
gap:10px;
font-size:19px;
font-weight:650;
margin-bottom:19px
}
.brand svg{
width:27px;
height:27px;
flex:none
}
.searchWrap{
position:relative
}
.searchIcon{
position:absolute;
left:13px;
top:10px;
color:#686868;
pointer-events:none
}
.search{
width:100%;
height:42px;
border:1px solid #292929;
background:#151515;
color:#eee;
border-radius:12px;
padding:0 12px 0 36px;
outline:0;
transition:border-color .2s,box-shadow .2s
}
.search:focus{
border-color:#4b4b4b;
box-shadow:0 0 0 4px #fff08
}
.search::placeholder{
color:#5c5c5c
}
.sideTitle{
padding:15px 17px 7px;
color:#626262;
font-size:10px;
font-weight:700;
letter-spacing:1.2px;
text-transform:uppercase
}
.folders{
max-height:230px;
overflow:auto;
padding:0 8px
}
.notes{
flex:1;
overflow:auto;
padding:0 8px 10px
}
.folder,
.note{
display:flex;
align-items:center;
min-height:40px;
padding:0 10px;
border-radius:9px;
margin:2px 0;
color:#a9a9a9;
font-size:14px;
transition:
background .18s,
color .18s,
transform .18s
}
.folder:hover,
.note:hover{
background:#181818;
color:#eee;
transform:translateX(1px)
}
.folder.active,
.note.active{
background:#232323;
color:#fff
}
.dot{
width:7px;
height:7px;
border:1px solid #888;
border-radius:50%;
margin-right:9px;
flex:none
}
.folderName,
.noteName{
flex:1;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}
.folderDel{
opacity:0;
background:none;
color:#555;
padding:4px 5px
}
.folder:hover .folderDel{
opacity:1
}
.addFolder,
.sideButton{
width:100%;
background:none;
color:#777;
text-align:left;
padding:9px 10px;
border-radius:8px;
transition:
background .18s,
color .18s
}
.addFolder:hover,
.sideButton:hover{
background:#181818;
color:#eee
}
.sideBottom{
border-top:1px solid var(--line);
padding:8px
}

/* MAIN */
#main{
min-width:0;
flex:1;
height:100%;
display:flex;
flex-direction:column
}
.topbar{
height:58px;
min-height:58px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
gap:3px;
padding:0 12px
}
.icon{
width:37px;
height:37px;
background:none;
border-radius:10px;
color:#999;
display:grid;
place-items:center;
transition:
background .18s,
color .18s,
transform .18s
}
.icon:hover{
background:#191919;
color:#fff;
transform:translateY(-1px)
}
.icon.active{
background:#252525;
color:#fff
}
.status{
margin-left:auto;
color:#5d5d5d;
font-size:11px;
padding-right:5px
}

/* TITLE */
.noteHeader{
display:flex;
align-items:center;
padding:34px 8% 15px
}
.title{
flex:1;
min-width:0;
border:0;
outline:0;
background:transparent;
color:#f4f4f4;
font-size:40px;
font-weight:680;
letter-spacing:-1.5px
}
.title::placeholder{
color:#4e4e4e
}
.pin{
color:#777;
margin-left:10px
}

/* TOOLBAR */
.toolbar{
margin:0 8%;
height:49px;
border-top:1px solid var(--line);
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
gap:2px;
overflow-x:auto
}
.tool{
height:34px;
min-width:34px;
padding:0 9px;
background:none;
border-radius:8px;
color:#999;
display:grid;
place-items:center;
transition:
background .18s,
color .18s,
transform .18s
}
.tool:hover{
background:#191919;
color:#fff;
transform:translateY(-1px)
}
.tool.active{
background:#eee;
color:#111
}
.sep{
width:1px;
height:22px;
background:#292929;
margin:0 5px;
flex:none
}

/* EDITOR */
.editorWrap{
position:relative;
flex:1;
min-height:0;
overflow:auto;
padding:28px 8% 75px
}
.editor{
min-height:520px;
outline:0;
color:#e8e8e8;
font-size:17px;
line-height:1.76;
caret-color:#fff;
transition:opacity .2s
}
.editor:empty:before{
content:"Start writing here...";
color:#4d4d4d
}
.editor h1{
font-size:33px;
line-height:1.18
}
.editor h2{
font-size:25px;
line-height:1.25
}
.editor h3{
font-size:20px
}
.editor pre{
background:#121212;
border:1px solid #292929;
border-radius:11px;
padding:15px;
white-space:pre-wrap
}
.editor blockquote{
border-left:3px solid #626262;
padding-left:15px;
color:#aaa
}
.editor a{
color:#eee
}
.editor mark{
background:var(--highlight);
color:#111;
padding:0 2px;
border-radius:3px
}
.editor table{
border-collapse:collapse;
width:100%
}
.editor td{
border:1px solid #333;
padding:12px;
vertical-align:top
}
.stats{
height:34px;
min-height:34px;
border-top:1px solid var(--line);
display:flex;
align-items:center;
padding:0 8%;
font-size:11px;
color:#606060
}

/* TEXT COLOUR */
.pop{
position:fixed;
z-index:500;
display:none;
background:rgba(23,23,23,.96);
border:1px solid #3a3a3a;
border-radius:14px;
padding:9px;
box-shadow:0 20px 60px #000b;
backdrop-filter:blur(20px);
gap:7px;
flex-wrap:wrap;
animation:popIn .18s var(--ease)
}
.pop.show{
display:flex
}
@keyframes popIn{
from{
opacity:0;
transform:translateY(-5px) scale(.96)
}
to{
opacity:1;
transform:none
}
}
.swatch{
width:28px;
height:28px;
border-radius:50%;
border:2px solid #555
}
.sblack{background:#050505}
.swhite{background:#fff}
.sred{background:#ff453a}
.sorange{background:#ff9f0a}
.syellow{background:#ffd60a}
.sgreen{background:#30d158}
.sblue{background:#0a84ff}
.spurple{background:#bf5af2}
.spink{background:#ff375f}

/* DRAWING */
#drawOverlay{
position:absolute;
inset:0;
z-index:200;
display:none;
background:rgba(7,7,7,.08);
backdrop-filter:blur(1px)
}
#drawOverlay.highlighterMode{
pointer-events:none;
background:transparent!important;
backdrop-filter:none!important;
-webkit-backdrop-filter:none!important
}
#drawOverlay.highlighterMode .drawTop,
#drawOverlay.highlighterMode .drawBottom,
#drawOverlay.highlighterMode #ruler{
pointer-events:auto
}
#drawOverlay.highlighterMode .drawBottom{
display:none
}
.drawCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
touch-action:none
}
.drawTop{
position:absolute;
top:10px;
right:16px;
left:auto;
transform:none;
display:flex;
align-items:center;
gap:5px;
padding:7px;
background:rgba(26,26,26,.92);
border:1px solid #393939;
border-radius:14px;
box-shadow:0 15px 45px #0009;
backdrop-filter:blur(22px);
max-width:94%;
overflow:auto
}
.drawBottom{
position:absolute;
bottom:17px;
left:50%;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:5px;
padding:7px;
background:rgba(26,26,26,.92);
border:1px solid #393939;
border-radius:15px;
box-shadow:0 18px 55px #0009;
backdrop-filter:blur(22px);
max-width:96%;
overflow:auto
}
.drawTool{
height:36px;
padding:0 11px;
border-radius:9px;
background:#232323;
color:#aaa;
font-size:12px;
white-space:nowrap;
transition:.18s
}
.drawTool:hover{
background:#333;
color:#fff
}
.drawTool.active{
background:#f0f0f0;
color:#111
}
.drawColor{
width:25px;
height:25px;
border-radius:50%;
border:2px solid #555;
flex:none
}
.drawColor.selected{
border-color:#fff;
box-shadow:0 0 0 2px #111 inset
}
.cBlack{background:#050505}
.cWhite{background:#fff}
.cRed{background:#ff453a}
.cOrange{background:#ff9f0a}
.cYellow{background:#ffd60a}
.cGreen{background:#30d158}
.cBlue{background:#0a84ff}
.cPurple{background:#bf5af2}
.cPink{background:#ff375f}
.size{
height:36px;
background:#232323;
border:0;
color:#aaa;
border-radius:9px;
padding:0 7px
}
.ruler{
position:absolute;
z-index:3;
left:20%;
top:30%;
width:360px;
height:48px;
border-radius:9px;
background:linear-gradient(#4b4b4b,#292929);
border:1px solid #777;
box-shadow:0 12px 35px #000b;
display:none;
align-items:flex-end;
justify-content:space-around;
padding:0 10px 7px;
color:#bbb;
font-size:9px;
cursor:grab;
touch-action:none
}
.ruler.show{
display:flex
}
.ruler:before{
content:"";
position:absolute;
left:10px;
right:10px;
top:9px;
height:1px;
background:#777;
box-shadow:
0 8px #666,
0 16px #666,
0 24px #666
}
.ruler:active{
cursor:grabbing
}

/* TEMPLATES */
.templateGrid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}
.templateCard{
background:#151515;
border:1px solid #292929;
border-radius:14px;
padding:12px;
text-align:left;
transition:.2s
}
.templateCard:hover{
background:#1d1d1d;
border-color:#444;
transform:translateY(-2px)
}
.templatePreview{
height:100px;
border-radius:9px;
background:#0c0c0c;
border:1px solid #292929;
padding:10px;
display:grid;
gap:7px;
margin-bottom:10px
}
.templatePreview span{
display:block;
height:7px;
background:#333;
border-radius:4px
}
.shapeDaily{
grid-template-columns:1fr
}
.shapeDaily span:nth-child(1){width:55%;height:12px}
.shapeDaily span:nth-child(2){width:85%}
.shapeDaily span:nth-child(3){width:72%}
.shapeDaily span:nth-child(4){width:90%}
.shapeCornell{
grid-template-columns:35% 65%;
grid-template-rows:1fr 20px
}
.shapeCornell span:nth-child(3){
grid-column:1/3
}
.shapeExam{
grid-template-columns:1fr 1fr
}
.shapeExam span:nth-child(1),
.shapeExam span:nth-child(4){
height:13px
}
.shapeEssay{
grid-template-columns:1fr
}
.shapeEssay span:nth-child(2){
width:75%
}
.shapeEssay span:nth-child(3){
width:90%
}
.shapeProject{
grid-template-columns:1fr 1fr
}
.shapeFlash{
grid-template-columns:1fr 1fr 1fr
}
.templateName{
font-size:14px;
font-weight:650;
margin-bottom:4px
}
.templateDesc{
font-size:11px;
line-height:1.45;
color:#777
}

/* MODAL */
#modal{
position:fixed;
inset:0;
z-index:1000;
display:none;
place-items:center;
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px)
}
#modal.show{
display:grid;
animation:modalIn .2s ease
}
.modalBox{
width:min(620px,92vw);
max-height:82vh;
overflow:auto;
background:#111;
border:1px solid #333;
border-radius:18px;
box-shadow:0 30px 100px #000c;
padding:20px
}
.modalHeader{
display:flex;
align-items:center;
margin-bottom:18px
}
.modalTitle{
font-size:22px;
font-weight:650;
flex:1
}
.modalClose{
width:34px;
height:34px;
border-radius:9px;
background:#1b1b1b;
color:#aaa
}
.modalClose:hover{
background:#292929;
color:#fff
}
.settingRow{
display:flex;
align-items:center;
gap:12px;
padding:15px 0;
border-bottom:1px solid #252525;
color:#aaa;
font-size:13px
}
.settingRow button{
margin-left:auto;
background:#242424;
padding:8px 11px;
border-radius:8px;
color:#ddd
}
.settingRow button:hover{
background:#333
}
.helpText{
font-size:14px;
line-height:1.7;
color:#aaa
}
@keyframes modalIn{
from{
opacity:0;
transform:scale(.96) translateY(8px)
}
to{
opacity:1;
transform:none
}
}

/* MOBILE */
@media(max-width:700px){
#sidebar{
width:260px;
min-width:260px
}
.noteHeader{
padding-left:5%;
padding-right:5%
}
.toolbar{
margin-left:5%;
margin-right:5%
}
.editorWrap{
padding-left:5%;
padding-right:5%
}
.stats{
padding-left:5%;
padding-right:5%
}
.title{
font-size:31px
}
.drawTop{
right:8px;
max-width:calc(100% - 16px)
}
.drawBottom{
max-width:calc(100% - 16px)
}
.templateGrid{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<div id="intro">
<div class="introCore">
<svg class="introLogo" viewBox="0 0 120 120">
<ellipse
cx="60"
cy="60"
rx="49"
ry="20"
fill="none"
stroke="#707070"
stroke-width="1.4"
transform="rotate(45 60 60)"
/>
<circle cx="60" cy="60" r="16" fill="#202020"/>
<circle cx="60" cy="60" r="10" fill="#f4f4f4"/>
</svg>
<div class="introName">StudyNotes</div>
<div class="introRule"></div>
</div>
</div>

<div id="app">

<aside id="sidebar">

<div class="sideTop">

<div class="brand">
<svg viewBox="0 0 100 100">
<ellipse cx="50" cy="50" rx="39" ry="16" fill="none" stroke="#777" stroke-width="3"/>
<ellipse cx="50" cy="50" rx="39" ry="16" fill="none" stroke="#777" stroke-width="3" transform="rotate(60 50 50)"/>
<ellipse cx="50" cy="50" rx="39" ry="16" fill="none" stroke="#777" stroke-width="3" transform="rotate(120 50 50)"/>
<circle cx="50" cy="50" r="9" fill="#ddd"/>
</svg>
<span>StudyNotes</span>
</div>

<div class="searchWrap">
<div class="searchIcon">⌕</div>
<input id="search" class="search" placeholder="Search notes...">
</div>

</div>

<div class="sideTitle">Folders</div>

<div id="folders" class="folders"></div>

<button class="addFolder" onclick="createFolder()">＋ New folder</button>

<button class="addFolder" onclick="createSecretFolder()">🔒 Secret folder</button>

<div class="sideTitle">Notes</div>

<div id="notes" class="notes"></div>

<div class="sideBottom">
<button class="sideButton" onclick="newNote()">＋ New note</button>
<button class="sideButton" onclick="templates()">▦ Templates</button>
</div>

</aside>

<main id="main">

<div class="topbar">

<button class="icon" onclick="toggleSidebar()" title="Toggle side panel">☰</button>

<button class="icon" onclick="newNote()" title="New note">＋</button>

<button class="icon" onclick="deleteNote()" title="Delete note">⌫</button>

<button class="icon" onclick="duplicateNote()" title="Duplicate note">⧉</button>

<button class="icon" onclick="togglePreview()" title="Markdown preview">◫</button>

<button class="icon" id="drawBtn" onclick="openDrawing()" title="Drawing tools">✎</button>

<button class="icon" onclick="settings()" title="Settings">⚙</button>

<button class="icon" onclick="help()" title="Help">?</button>

<div class="status" id="status">Saved</div>

</div>

<div class="noteHeader">
<input id="title" class="title" placeholder="Untitled note" spellcheck="false">
<button id="pinBtn" class="icon pin" onclick="togglePin()" title="Pin note">☆</button>
</div>

<div class="toolbar">

<button class="tool" onclick="format('bold')" title="Bold"><b>B</b></button>
<button class="tool" onclick="format('italic')" title="Italic"><i>I</i></button>
<button class="tool" onclick="format('underline')" title="Underline"><u>U</u></button>

<div class="sep"></div>

<button class="tool" onclick="format('formatBlock','H2')" title="Heading">H2</button>
<button class="tool" onclick="format('insertUnorderedList')" title="Bullet list">•</button>
<button class="tool" onclick="format('insertOrderedList')" title="Numbered list">1.</button>
<button class="tool" onclick="insertChecklist()" title="Checklist">☑</button>
<button class="tool" onclick="insertCode()" title="Code block">&lt;/&gt;</button>
<button class="tool" onclick="insertLink()" title="Link">↗</button>

<div class="sep"></div>

<button class="tool" onclick="showTextColors()" title="Text colour">A</button>
<button class="tool" id="highlightBtn" onclick="toggleHighlighter()" title="Highlight word">▰</button>
<button class="tool" onclick="openDrawing()" title="Draw">✎</button>

</div>

<div id="editorWrap" class="editorWrap">

<div id="editor" class="editor" contenteditable="true" spellcheck="true"></div>

<div id="drawOverlay">

<canvas id="drawCanvas" class="drawCanvas"></canvas>

<div class="drawTop">

<button class="drawTool active" data-draw="pen" onclick="setDrawTool('pen')">Pen</button>
<button class="drawTool" data-draw="pencil" onclick="setDrawTool('pencil')">Pencil</button>
<button class="drawTool" data-draw="marker" onclick="setDrawTool('marker')">Marker</button>
<button class="drawTool" data-draw="ruler" onclick="setDrawTool('ruler')">Ruler</button>
<button class="drawTool" data-draw="eraser" onclick="setDrawTool('eraser')">Eraser</button>

<div class="drawSeparator"></div>

<button class="drawTool" id="drawHighlighter" onclick="activateDrawingHighlighter()" title="Highlight words">▰</button>

<button class="drawTool drawClose" onclick="closeDrawing()" title="Close drawing tools">×</button>

</div>

<div class="drawBottom">

<button class="drawColor cBlack selected" onclick="setDrawColor('#050505',this)"></button>
<button class="drawColor cWhite" onclick="setDrawColor('#ffffff',this)"></button>
<button class="drawColor cRed" onclick="setDrawColor('#ff453a',this)"></button>
<button class="drawColor cOrange" onclick="setDrawColor('#ff9f0a',this)"></button>
<button class="drawColor cYellow" onclick="setDrawColor('#ffd60a',this)"></button>
<button class="drawColor cGreen" onclick="setDrawColor('#30d158',this)"></button>

<script>

const KEY="studynotes_ultra_v2";

const pastelColors=[
"#C8B6E2",
"#B8D8D8",
"#F2C6DE",
"#C7E9B0",
"#F4D6A6",
"#BFD7EA",
"#D8C3A5",
"#C6D8D1",
"#D9C2F0",
"#F1D3B3"
];

let data={
folders:["General","School"],
notes:[],
current:"",
secretFolders:{},
folderColors:{}
};

let currentFolder="General";

let highlighter=false;
let drawTool="pen";
let drawColor="#050505";
let drawing=false;
let drawCanvas=null;
let drawCtx=null;
let undoStack=[];
let redoStack=[];

function $(id){
return document.getElementById(id)
}

function uid(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8)
}

function codeHash(value){
let hash=0;
for(let i=0;i<value.length;i++){
hash=((hash<<5)-hash)+value.charCodeAt(i);
hash|=0
}
return String(hash)
}

function save(){
localStorage.setItem(KEY,JSON.stringify(data));
$("status").textContent="Saved"
}

function load(){

try{

const saved=JSON.parse(localStorage.getItem(KEY)||"null");

if(saved){

data=saved;

if(!Array.isArray(data.folders))
data.folders=["General"];

if(!Array.isArray(data.notes))
data.notes=[];

if(!data.secretFolders)
data.secretFolders={};

if(!data.folderColors)
data.folderColors={};

}

}catch(e){}

if(!Array.isArray(data.folders))
data.folders=["General"];

if(!data.secretFolders)
data.secretFolders={};

if(!data.folderColors)
data.folderColors={};

/* GIVE EVERY FOLDER A PASTEL DOT */
data.folders.forEach((folder,index)=>{
if(!data.folderColors[folder]){
data.folderColors[folder]=pastelColors[index%pastelColors.length]
}
});

/* REMOVE OLD WELCOME/STARTER NOTES */
data.notes=data.notes.filter(n=>{
const title=(n.title||"").trim().toLowerCase();
return title!=="welcome" &&
title!=="welcome to studynotes" &&
title!=="start writing"
});

if(!data.notes.length){

const n={
id:uid(),
title:"",
html:"",
folder:data.folders[0]||"General",
pinned:false,
created:Date.now(),
updated:Date.now(),
drawing:""
};

data.notes.push(n);
data.current=n.id
}else{

if(!data.current||
!data.notes.some(n=>n.id===data.current))
data.current=data.notes[0].id

}

currentFolder=
data.notes.find(n=>n.id===data.current)?.folder||
data.folders[0]||
"General";

save();
render();

setTimeout(()=>{
$("intro").classList.add("exit")
},3000)

}

/* RENDER */

function render(){
renderFolders();
renderNotes();
renderEditor()
}

/* FOLDERS */

function renderFolders(){

const box=$("folders");
box.innerHTML="";

data.folders.forEach(folder=>{

const row=document.createElement("div");

row.className=
"folder"+
(currentFolder===folder?" active":"");

const color=
data.folderColors?.[folder]||
pastelColors[
data.folders.indexOf(folder)%pastelColors.length
];

row.innerHTML=
'<span class="dot" style="background:'+color+';border-color:'+color+';box-shadow:0 0 7px '+color+'55"></span>'+
'<span class="folderName">'+escapeHtml(folder)+'</span>'+
'<button class="folderDel" title="Delete folder">×</button>';

row.onclick=()=>{
if(data.secretFolders&&data.secretFolders[folder]){
if(!unlockSecretFolder(folder))return
}
currentFolder=folder;
renderFolders();
renderNotes()
};

row.querySelector(".folderDel").onclick=e=>{
e.stopPropagation();
deleteFolder(folder)
};

box.appendChild(row)

});

/* EXISTING PRIVATE FOLDER */

const pr=document.createElement("div");

pr.className=
"folder"+
(currentFolder==="__private__"?" active":"");

pr.innerHTML=
'<span class="dot" style="background:#C8B6E2;border-color:#C8B6E2;box-shadow:0 0 7px #C8B6E255"></span>'+
'<span class="folderName">Private</span>'+
'<span class="folderActions"><button class="folderAction" title="Private">⌘</button></span>';

pr.onclick=()=>openPrivateFolder();

box.appendChild(pr)

}

/* NOTES */

function renderNotes(){

const box=$("notes");
box.innerHTML="";

const q=
$("search").value.trim().toLowerCase();

let notes=
data.notes.filter(n=>
n.folder===currentFolder
);

if(q){

notes=data.notes.filter(n=>
(n.title||"").toLowerCase().includes(q)||
stripHtml(n.html||"").toLowerCase().includes(q)
)

}

notes
.sort((a,b)=>
Number(b.pinned)-Number(a.pinned)||
b.updated-a.updated
)
.forEach(n=>{

const row=document.createElement("div");

row.className=
"note"+
(n.id===data.current?" active":"");

row.innerHTML=
'<span class="dot"></span>'+
'<span class="noteName">'+
escapeHtml(n.title||"Untitled note")+
'</span>'+
(n.pinned?'<span>•</span>':"");

row.onclick=()=>{
data.current=n.id;
currentFolder=n.folder;
save();
render()
};

box.appendChild(row)

})

}

/* EDITOR */

function renderEditor(){

const n=currentNote();

if(!n)return;

$("title").value=n.title||"";
$("editor").innerHTML=n.html||"";

$("pinBtn").textContent=
n.pinned?"★":"☆";

updateStats()

}

/* CURRENT */

function currentNote(){
return data.notes.find(n=>n.id===data.current)
}

/* NEW NOTE */

function newNote(){

const n={
id:uid(),
title:"",
html:"",
folder:currentFolder==="__private__"?"General":currentFolder,
pinned:false,
created:Date.now(),
updated:Date.now(),
drawing:""
};

data.notes.unshift(n);
data.current=n.id;

if(currentFolder==="__private__")
currentFolder="General";

save();
render();

setTimeout(()=>{
$("title").focus()
},50)

}

/* DELETE NOTE */

function deleteNote(){

const n=currentNote();

if(!n)return;

if(!confirm("Delete this note?"))
return;

const index=data.notes.findIndex(x=>x.id===n.id);

data.notes.splice(index,1);

let replacement=
data.notes.find(x=>x.folder===currentFolder)||
data.notes[0];

if(!replacement){

replacement={
id:uid(),
title:"",
html:"",
folder:data.folders[0]||"General",
pinned:false,
created:Date.now(),
updated:Date.now(),
drawing:""
};

data.notes.push(replacement)
}

data.current=replacement.id;
currentFolder=replacement.folder;

save();
render()

}

/* DUPLICATE */

function duplicateNote(){

const n=currentNote();

if(!n)return;

const copy={
...n,
id:uid(),
title:(n.title||"Untitled note")+" copy",
created:Date.now(),
updated:Date.now()
};

data.notes.unshift(copy);
data.current=copy.id;

save();
render()

}

/* PIN */

function togglePin(){

const n=currentNote();

if(!n)return;

n.pinned=!n.pinned;
n.updated=Date.now();

save();
renderNotes();
renderEditor()

}

/* UPDATE */

function update(){

const n=currentNote();

if(!n)return;

n.title=$("title").value;
n.html=$("editor").innerHTML;
n.updated=Date.now();

save();

renderNotes();
updateStats()

}

$("title").addEventListener("input",update);

$("editor").addEventListener("input",update);

function format(command,value=null){

document.execCommand(

/* HIGHLIGHTER */

function toggleHighlighter(){

highlighter=!highlighter;

$("highlightBtn")
.classList
.toggle("active",highlighter);

$("editor").style.cursor=
highlighter?"pointer":""

}

function wordRangeFromPoint(e){

let node=null;
let offset=0;

if(document.caretRangeFromPoint){

const range=
document.caretRangeFromPoint(
e.clientX,
e.clientY
);

if(range){
node=range.startContainer;
offset=range.startOffset
}

}else if(document.caretPositionFromPoint){

const pos=
document.caretPositionFromPoint(
e.clientX,
e.clientY
);

if(pos){
node=pos.offsetNode;
offset=pos.offset
}

}

if(!node)return null;

if(node.nodeType!==Node.TEXT_NODE){

if(node.childNodes.length){

node=node.childNodes[
Math.min(
offset,
node.childNodes.length-1
)
];

if(node.nodeType!==Node.TEXT_NODE)
return null

}else return null

}

const text=node.textContent||"";

if(!text.trim())return null;

let start=offset;

while(
start>0 &&
!/\s/.test(text[start-1])
){
start--
}

let end=offset;

while(
end<text.length &&
!/\s/.test(text[end])
){
end++
}

if(start===end)return null;

const range=document.createRange();

range.setStart(node,start);
range.setEnd(node,end);

return range

}

$("editor").addEventListener("click",e=>{

if(!highlighter)return;

const r=wordRangeFromPoint(e);

if(!r)return;

const sel=getSelection();

sel.removeAllRanges();
sel.addRange(r);

document.execCommand(
"hiliteColor",
false,
"#c9c35b"
);

document.execCommand(
"backColor",
false,
"#c9c35b"
);

sel.collapseToEnd();

update()

});

/* PREVIEW */

let preview=false;

function togglePreview(){

preview=!preview;

if(preview){

const n=currentNote();

$("editor").contentEditable=false;

$("editor").innerHTML=
markdownToHtml(
stripHtml(n?.html||"")
);

}else{

renderEditor()

}

}

/* MARKDOWN */

function markdownToHtml(text){

return escapeHtml(text)
.replace(/^### (.*)$/gm,"<h3>$1</h3>")
.replace(/^## (.*)$/gm,"<h2>$1</h2>")
.replace(/^# (.*)$/gm,"<h1>$1</h1>")
.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
.replace(/\*(.*?)\*/g,"<em>$1</em>")
.replace(/`(.*?)`/g,"<code>$1</code>")
.replace(/\n/g,"<br>")

}

/* SIDEBAR */

function toggleSidebar(){

$("sidebar").classList.toggle("closed")

}

/* FOLDERS */

function createFolder(){

const value=
prompt("Folder name:");

if(!value||!value.trim())
return;

const folder=value.trim();

if(data.folders.includes(folder)){

alert("That folder already exists.");
return

}

if(!data.folderColors)
data.folderColors={};

const color=
pastelColors[
data.folders.length%pastelColors.length
];

data.folderColors[folder]=color;

data.folders.push(folder);

currentFolder=folder;

save();
renderFolders();
renderNotes()

}

/* SECRET FOLDER */

function createSecretFolder(){

const value=
prompt("Secret folder name:");

if(!value||!value.trim())
return;

const code=
prompt("Create a code for this folder:");

if(code===null||!code.trim())
return;

const folder=value.trim();

if(data.folders.includes(folder)){

alert("That folder already exists.");
return

}

if(!data.secretFolders)
data.secretFolders={};

if(!data.folderColors)
data.folderColors={};

data.secretFolders[folder]=
codeHash(code.trim());

data.folderColors[folder]=
pastelColors[
data.folders.length%pastelColors.length
];

data.folders.push(folder);

currentFolder=folder;

save();
renderFolders();
renderNotes()

}

function unlockSecretFolder(folder){

if(
!data.secretFolders||
!data.secretFolders[folder]
)
return true;

const code=
prompt("Enter the code for "+folder+":");

if(code===null)
return false;

if(
codeHash(code.trim())!==
data.secretFolders[folder]
){

alert("Wrong code.");
return false

}

return true

}

/* DELETE FOLDER */

function deleteFolder(folder){

if(data.folders.length<=1){

alert("You need at least one folder.");
return

}

if(!confirm("Delete folder and its notes?"))
return;

data.notes=
data.notes.filter(
n=>n.folder!==folder
);

data.folders=
data.folders.filter(
x=>x!==folder
);

if(data.secretFolders)
delete data.secretFolders[folder];

if(data.folderColors)
delete data.folderColors[folder];

currentFolder=
data.folders[0];

let n=
data.notes.find(
x=>x.folder===currentFolder
);

if(!n){

n={
id:uid(),
title:"",
html:"",
folder:currentFolder,
pinned:false,
created:Date.now(),
updated:Date.now(),
drawing:""
};

data.notes.push(n)
}

data.current=n.id;

save();
render()

}

/* PRIVATE */

function privateCode(){

return localStorage.getItem(
KEY+"_private_code"
)

}

function openPrivateFolder(){

let code=
privateCode();

if(!code){

const newCode=
prompt("Create your private folder code:");

if(newCode===null||!newCode.trim())
return;

code=codeHash(newCode.trim());

localStorage.setItem(
KEY+"_private_code",
code
)

}else{

const entered=
prompt("Enter private folder code:");

if(entered===null)
return;

if(
codeHash(entered.trim())!==code
){

alert("Wrong code.");
return

}

}

currentFolder="__private__";

renderFolders();
renderNotes()

}

/* DRAWING */

function openDrawing(){

if(drawCanvas)
return;

$("drawOverlay")
.style.display=
"block";

$("editorWrap")?.classList.add("drawingToolsOpen");

drawCanvas=
$("drawCanvas");

drawCanvas.width=
$("editorWrap").clientWidth;

drawCanvas.height=
$("editorWrap").clientHeight;

drawCtx=
drawCanvas.getContext("2d");

drawCtx.lineCap=
"round";

drawCtx.lineJoin=
"round";

undoStack=[];
redoStack=[];

const n=
currentNote();

if(
n &&
n.drawing
){

const image=
new Image();

image.onload=()=>{
drawCtx.drawImage(
image,
0,
0
)
};

image.src=
n.drawing

}

saveDrawState();

drawCanvas.addEventListener(
"pointerdown",
drawStart
);

drawCanvas.addEventListener(
"pointermove",
drawMove
);

window.addEventListener(
"pointerup",
drawEnd
);

$("drawBtn")
.classList
.add("active")

}

/* DRAW START */

function drawStart(e){

if(
drawTool==="ruler"
){

showRuler();
return

}

drawing=true;

drawCanvas
.setPointerCapture?.(
e.pointerId
);

const p=
point(e);

drawCtx.beginPath();

drawCtx.moveTo(
p.x,
p.y
)

}

/* DRAW MOVE */

function drawMove(e){

if(!drawing)
return;

const p=
point(e);

drawCtx.globalCompositeOperation=
drawTool==="eraser"
?"destination-out"
:"source-over";

let size=
Number(
$("drawSize").value
);

if(
drawTool==="pencil"
){

size=
Math.max(
1,
size*.48
)

}

if(
drawTool==="marker"
){

size*=3

}

drawCtx.lineWidth=
size;

drawCtx.globalAlpha=
drawTool==="marker"
?.28
:1;

drawCtx.strokeStyle=
drawColor;

drawCtx.lineTo(
p.x,
p.y
);

drawCtx.stroke()

}

/* DRAW END */

function drawEnd(){

if(!drawing)
return;

drawing=false;

drawCtx.globalAlpha=1;

drawCtx.globalCompositeOperation=
"source-over";

saveDrawState();
persistDrawing()

}

/* DRAW POSITION */

function point(e){

const rect=
drawCanvas
.getBoundingClientRect();

return{
x:e.clientX-rect.left,
y:e.clientY-rect.top
}

}

/* DRAW TOOL */

function setDrawTool(tool){

drawTool=tool;
highlighter=false;

$("highlightBtn")?.classList.remove("active");
$("drawHighlighter")?.classList.remove("active");
$("drawOverlay")?.classList.remove("highlighterMode");
$("editor").style.cursor="";

document
.querySelectorAll("[data-draw]")
.forEach(button=>{
button.classList.toggle(
"active",
button.dataset.draw===tool
);
});

if(tool==="ruler"){
showRuler();
}else{
hideRuler()
}

}

function activateDrawingHighlighter(){

highlighter=true;
drawTool="highlighter";

$("drawHighlighter")?.classList.add("active");

document
.querySelectorAll("[data-draw]")
.forEach(button=>
button.classList.remove("active")
);

hideRuler();

$("drawOverlay")
?.classList
.add("highlighterMode");

$("editor").style.cursor="pointer";

}

/* DRAW COLOUR */

function setDrawColor(
color,
button
){

drawColor=color;

document
.querySelectorAll(
".drawColor"
)
.forEach(
b=>
b.classList.remove(
"selected"
)
);

button.classList.add(
"selected"
);

if(
drawTool==="eraser"
){

setDrawTool("pen")

}

}

/* DRAW HISTORY */

function saveDrawState(){

if(!drawCanvas)
return;

undoStack.push(
drawCanvas.toDataURL()
);

if(
undoStack.length>35
){

undoStack.shift()

}

redoStack=[]

}

function restoreDraw(src){

const image=
new Image();

image.onload=()=>{

drawCtx.clearRect(
0,
0,
drawCanvas.width,
drawCanvas.height
);

drawCtx.drawImage(
image,
0,
0
);

persistDrawing()

};

image.src=src

}

function undoDraw(){

if(
undoStack.length<2
)
return;

redoStack.push(
undoStack.pop()
);

restoreDraw(
undoStack[
undoStack.length-1
]
)

}

function redoDraw(){

if(!redoStack.length)
return;

const state=
redoStack.pop();

undoStack.push(state);

restoreDraw(state)

}

function clearDraw(){

if(
!confirm(
"Clear the drawing?"
)
)
return;

drawCtx.clearRect(
0,
0,
drawCanvas.width,
drawCanvas.height
);

saveDrawState();
persistDrawing()

}

function persistDrawing(){

const n=
currentNote();

if(
n &&
drawCanvas
){

n.drawing=
drawCanvas.toDataURL();

save()

}

}

function closeDrawing(){

persistDrawing();

$("drawOverlay")
.classList
.remove("highlighterMode");

$("drawOverlay")
.style.display="none";

$("drawBtn")
.classList
.remove("active");

$("drawHighlighter")
?.classList
.remove("active");

highlighter=false;
drawTool="pen";

$("editor").style.cursor="";

drawCanvas=null;
drawCtx=null;

hideRuler()

}

/* RULER */

function showRuler(){

$("ruler")
.classList
.add("show")

}

function hideRuler(){

$("ruler")
.classList
.remove("show")

}

let rulerDrag=false;
let rx=0;
let ry=0;

const ruler=
$("ruler");

ruler.addEventListener(
"pointerdown",
e=>{

rulerDrag=true;

rx=
e.clientX-
ruler.offsetLeft;

ry=
e.clientY-
ruler.offsetTop;

ruler
.setPointerCapture?.(
e.pointerId
)

}
);

ruler.addEventListener(
"pointermove",
e=>{

if(!rulerDrag)
return;

ruler.style.left=
(
e.clientX-rx
)+"px";

ruler.style.top=
(
e.clientY-ry
)+"px"

}
);

ruler.addEventListener(
"pointerup",
()=>{

rulerDrag=false

}
);

/* TEMPLATES */

const templatesData={

"Daily Study":{
desc:
"A calm daily page for goals, notes and review.",
shape:

/* TEMPLATE WINDOW */

function templates(){

let html=
'<div class="templateGrid">';

Object.entries(
templatesData
)
.forEach(
([name,t])=>{

html+=
'<button class="templateCard" onclick="useTemplate('+JSON.stringify(name)+')">'+
'<div class="templatePreview '+t.shape+'">'+
'<span></span>'+
'<span></span>'+
'<span></span>'+
'<span></span>'+
'</div>'+

name+
'</div>'+

t.desc+
'</div>'+

}
);

/* USE TEMPLATE */

function useTemplate(name){

const n=
currentNote();

if(!n)
return;

n.title=name;
n.html=
templatesData[name].html;

save();
closeModal();
render()

}

/* SETTINGS */

function settings(){

openModal(
"Settings",

'<div class="settingRow">Private folder code.<button onclick="changePrivateCode()">Change code</button></div>'+

'<div class="settingRow">'+
'Your notes are saved locally in this browser.'+
'<button onclick="exportData()">Export backup</button>'+
'</div>'+

'<div class="settingRow">'+
'Reset your local StudyNotes data.'+
'<button onclick="resetData()">Reset all</button>'+
'</div>'

)

}

function changePrivateCode(){

const old=
privateCode();

if(!old)
return openPrivateFolder();

const cur=
prompt("Current private code:");

if(cur===null)
return;

if(
codeHash(cur.trim())!==old
)
return alert("Wrong current code.");

const next=
prompt("New private code:");

if(
next===null||
!next.trim()
)
return;

localStorage.setItem(
KEY+"_private_code",
codeHash(next.trim())
);

alert("Private code changed.")

}

/* EXPORT */

function exportData(){

const blob=
new Blob(
[
JSON.stringify(
data,
null,
2
)
],
{
type:"application/json"
}
);

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"StudyNotes-backup.json";

a.click();

setTimeout(
()=>
URL.revokeObjectURL(
a.href
),
1000
)

}

/* RESET */

function resetData(){

if(
confirm(
"Delete all notes and folders?"
)
){

localStorage.removeItem(
KEY
);

location.reload()

}

}

/* MODAL */

function openModal(
title,
body
){

$("modalTitle")
.textContent=
title;

$("modalBody")
.innerHTML=
body;

$("modal")
.classList
.add("show")

}

function closeModal(){

$("modal")
.classList
.remove("show")

}

/* SEARCH */

$("search")
.addEventListener(
"input",
renderNotes
);

/* KEYBOARD */

document.addEventListener(
"keydown",
e=>{

const modifier=
e.metaKey||
e.ctrlKey;

if(
modifier &&
e.key.toLowerCase()==="n"
){

e.preventDefault();
newNote()

}

if(
modifier &&
e.key.toLowerCase()==="s"
){

e.preventDefault();
update()

}

if(
modifier &&
e.key.toLowerCase()==="f"
){

e.preventDefault();
$("search").focus()

}

if(
e.key==="Escape"
){

closeModal();

$("textColors")
.classList
.remove("show");

if(highlighter){

highlighter=false;

$("highlightBtn")
.classList
.remove("active");

$("editor").style.cursor=""

}

}

}
);

/* HELPERS */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;")

}

function stripHtml(value){

const div=
document.createElement("div");

div.innerHTML=value;

return div.textContent||
div.innerText||
""

}
